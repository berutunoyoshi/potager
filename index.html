*{box-sizing:border-box}

function parseMonths(str){
  const out=new Set();
  String(str||'').split(/[\/,・、\s]+/).forEach(t=>{
    t=t.replace(/月/g,'').trim(); if(!t) return;
    const m=t.split(/[-~〜–]/).map(Number);
    if(m.length===2&&m[0]>=1&&m[0]<=12&&m[1]>=1&&m[1]<=12){let a=m[0];for(let i=0;i<12;i++){out.add(a);if(a===m[1])break;a=a%12+1;}}
    else if(m[0]>=1&&m[0]<=12) out.add(m[0]);
  });
  return [...out].sort((a,b)=>a-b);
}
function fmtMonths(arr){
  if(!arr||!arr.length) return '';
  const a=[...arr].sort((x,y)=>x-y), r=[]; let s=a[0],p=a[0];
  for(let i=1;i<=a.length;i++){ if(a[i]===p+1){p=a[i];continue;} r.push(s===p?`${s}`:`${s}-${p}`); s=p=a[i]; }
  return r.join('・')+'月';
}
function mkPlant(a){
  return {id:uid(),name:a[0],cat:a[1],seedM:parseMonths(a[2]),plantM:parseMonths(a[3]),harvM:parseMonths(a[4]),

}

    beds:[{id:uid(),name:'花壇A',shape:'rect',pts:rectPts(0,0,120,240)},{id:uid(),name:'花壇B',shape:'circle',c:{x:230,y:90,r:60},pts:circPts(230,90,60)}],
    plants:PRESETS.filter(a=>DEFAULT_PLANTS.includes(a[0])).map(mkPlant),
    plans:[{id:uid(),name:'春夏プラン',items:[]},{id:uid(),name:'秋冬プラン',items:[]}],activePlan:0};
}

/* ============ 保存 ============ */
const KEY='potager-planner-v1';
const NATIVE=!!(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.native);
function nativePost(o){try{window.webkit.messageHandlers.native.postMessage(o);}catch(e){}}
function load(){try{let t=null;try{t=localStorage.getItem(KEY);}catch(e){}if(!t&&window.__BOOT__)t=window.__BOOT__;if(!t)return null;const o=JSON.parse(t);if(!o||!Array.isArray(o.beds)||!Array.isArray(o.plans))return null;o.settings={...DEF,...o.settings};return o;}catch(e){return null;}}
let saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{const j=JSON.stringify(S);try{localStorage.setItem(KEY,j);}catch(e){}if(NATIVE)nativePost({type:'save',data:j});},250);}
let S=load()||newState();
let undoS=[],redoS=[];
function snapshot(){return JSON.stringify({beds:S.beds,plants:S.plants,plans:S.plans,activePlan:S.activePlan});}
function restore(t){const o=JSON.parse(t);S.beds=o.beds;S.plants=o.plants;S.plans=o.plans;S.activePlan=o.activePlan;}
function pushUndo(snap){undoS.push(snap||snapshot());if(undoS.length>80)undoS.shift();redoS=[];}
function undo(){if(!undoS.length)return toast('これ以上戻せません');redoS.push(snapshot());restore(undoS.pop());sel=null;changed();}
function redo(){if(!redoS.length)return toast('やり直す操作がありません');undoS.push(snapshot());restore(redoS.pop());sel=null;changed();}

/* ============ 実行時状態 ============ */
let tool='select', sel=null, active={pid:null,m:null}, polyPts=[], measure=null, conflicts=new Set(), tab='plants', ui={q:''};
const V={s:2.5,ox:60,oy:80};
const plan=()=>S.plans[S.activePlan]||S.plans[0];
const items=()=>plan().items;
const plantById=id=>S.plants.find(p=>p.id===id);
const bedById=id=>S.beds.find(b=>b.id===id);
const itemById=id=>items().find(i=>i.id===id);

/* ============ 幾何 ============ */
function rectPts(x0,y0,x1,y1){const a=Math.min(x0,x1),b=Math.min(y0,y1),c=Math.max(x0,x1),d=Math.max(y0,y1);return [[a,b],[c,b],[c,d],[a,d]];}
function circPts(cx,cy,r){const n=72,o=[];for(let i=0;i<n;i++){const t=i/n*Math.PI*2;o.push([cx+r*Math.cos(t),cy+r*Math.sin(t)]);}return o;}
function bbox(pts){let a=Infinity,b=Infinity,c=-Infinity,d=-Infinity;for(const p of pts){a=Math.min(a,p[0]);b=Math.min(b,p[1]);c=Math.max(c,p[0]);d=Math.max(d,p[1]);}return {minX:a,minY:b,maxX:c,maxY:d,w:c-a,h:d-b};}
function sArea(P){let s=0;for(let i=0;i<P.length;i++){const a=P[i],b=P[(i+1)%P.length];s+=a[0]*b[1]-b[0]*a[1];}return s/2;}
function bedArea(b){return b.shape==='circle'?Math.PI*b.c.r*b.c.r:Math.abs(sArea(b.pts));}
function bedPerim(b){if(b.shape==='circle')return 2*Math.PI*b.c.r;let s=0;for(let i=0;i<b.pts.length;i++){const a=b.pts[i],c=b.pts[(i+1)%b.pts.length];s+=Math.hypot(c[0]-a[0],c[1]-a[1]);}return s;}
function centroid(P){let A=0,cx=0,cy=0;for(let i=0;i<P.length;i++){const a=P[i],b=P[(i+1)%P.length],f=a[0]*b[1]-b[0]*a[1];A+=f;cx+=(a[0]+b[0])*f;cy+=(a[1]+b[1])*f;}if(Math.abs(A)<1e-9){const bb=bbox(P);return [(bb.minX+bb.maxX)/2,(bb.minY+bb.maxY)/2];}return [cx/(3*A),cy/(3*A)];}
function pip(x,y,P){let c=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const a=P[i],b=P[j];if(((a[1]>y)!==(b[1]>y))&&(x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0]))c=!c;}return c;}
function dPS(px,py,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],L=dx*dx+dy*dy;let t=L?((px-a[0])*dx+(py-a[1])*dy)/L:0;t=clamp(t,0,1);return Math.hypot(px-(a[0]+t*dx),py-(a[1]+t*dy));}
function orient(a,b,c){const v=(b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0]);return Math.abs(v)<1e-9?0:(v>0?1:-1);}
function onSeg(a,b,c){return Math.min(a[0],b[0])-1e-9<=c[0]&&c[0]<=Math.max(a[0],b[0])+1e-9&&Math.min(a[1],b[1])-1e-9<=c[1]&&c[1]<=Math.max(a[1],b[1])+1e-9;}
function segX(a,b,c,d){const o1=orient(a,b,c),o2=orient(a,b,d),o3=orient(c,d,a),o4=orient(c,d,b);if(o1!==o2&&o3!==o4)return true;if(o1===0&&onSeg(a,b,c))return true;if(o2===0&&onSeg(a,b,d))return true;if(o3===0&&onSeg(c,d,a))return true;if(o4===0&&onSeg(c,d,b))return true;return false;}
function dSS(a,b,c,d){if(segX(a,b,c,d))return 0;return Math.min(dPS(a[0],a[1],c,d),dPS(b[0],b[1],c,d),dPS(c[0],c[1],a,b),dPS(d[0],d[1],a,b));}
function bedOfPoint(x,y){for(let i=S.beds.length-1;i>=0;i--)if(pip(x,y,S.beds[i].pts))return S.beds[i];return null;}
function itemBed(it){return it.k==='s'?bedOfPoint(it.x,it.y):bedOfPoint(it.x1,it.y1);}
function rowLen(it){return Math.hypot(it.x2-it.x1,it.y2-it.y1);}

/* ============ 間隔チェック ============ */
function shapeOf(it){const p=plantById(it.p);if(!p)return null;return it.k==='s'?{id:it.id,k:'s',x:it.x,y:it.y,r:p.seedlingSp/2}:{id:it.id,k:'r',a:[it.x1,it.y1],b:[it.x2,it.y2],w:p.rowSp/2};}
function obstacles(exId){return items().filter(i=>i.id!==exId).map(shapeOf).filter(Boolean);}
function obsName(o){const it=o.id&&itemById(o.id);const p=it&&plantById(it.p);return p?p.name:'他の株';}
function checkCircle(x,y,r,obs,bedReq){
  const b=bedOfPoint(x,y);
  if(!b||(bedReq&&b!==bedReq))return {ok:false,msg:'花壇の外です'};
  const P=b.pts,n=P.length;
  for(let i=0;i<n;i++)if(dPS(x,y,P[i],P[(i+1)%n])<r-EPS)return {ok:false,bed:b,msg:`花壇の縁から${fmt(r)}cm以上離してください`};
  for(const o of obs){
    if(o.k==='s'){if(Math.hypot(x-o.x,y-o.y)<r+o.r-EPS)return {ok:false,bed:b,msg:`${obsName(o)}と株間が重なります`};}
    else if(dPS(x,y,o.a,o.b)<r+o.w-EPS)return {ok:false,bed:b,msg:`${obsName(o)}の条間と重なります`};
  }
  return {ok:true,bed:b};
}
function checkRow(a,b,w,obs,bedReq){
  const bd=bedOfPoint(a[0],a[1]);
  if(!bd||!pip(b[0],b[1],bd.pts)||(bedReq&&bd!==bedReq))return {ok:false,msg:'花壇の外です'};
  const P=bd.pts,n=P.length;
  for(let i=0;i<n;i++)if(dSS(a,b,P[i],P[(i+1)%n])<w-EPS)return {ok:false,bed:bd,msg:`花壇の縁から${fmt(w)}cm以上離してください`};
  for(const o of obs){
    if(o.k==='s'){if(dPS(o.x,o.y,a,b)<w+o.r-EPS)return {ok:false,bed:bd,msg:`${obsName(o)}と間隔が重なります`};}
    else if(dSS(a,b,o.a,o.b)<w+o.w-EPS)return {ok:false,bed:bd,msg:`${obsName(o)}の条間と重なります`};
  }
  return {ok:true,bed:bd};
}
function checkItem(it,obs){const p=plantById(it.p);if(!p)return {ok:true};return it.k==='s'?checkCircle(it.x,it.y,p.seedlingSp/2,obs):checkRow([it.x1,it.y1],[it.x2,it.y2],p.rowSp/2,obs);}
function fitRow(a,b,w,obs){
  const s0=checkCircle(a[0],a[1],w,obs);if(!s0.ok)return {ok:false,msg:s0.msg};
  const full=checkRow(a,b,w,obs);if(full.ok)return {ok:true,b,trim:false};
  let lo=0,hi=1;for(let i=0;i<22;i++){const m=(lo+hi)/2;const e=[a[0]+(b[0]-a[0])*m,a[1]+(b[1]-a[1])*m];if(checkRow(a,e,w,obs).ok)lo=m;else hi=m;}
  const L=Math.hypot(b[0]-a[0],b[1]-a[1])*lo, f=Math.floor(L*2)/2/(Math.hypot(b[0]-a[0],b[1]-a[1])||1);
  const e=[a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f];
  return {ok:L>=2,b:e,trim:true,msg:full.msg};
}
function computeConflicts(){conflicts=new Set();for(const it of items()){if(!checkItem(it,obstacles(it.id)).ok)conflicts.add(it.id);}}

/* ============ 数量計算 ============ */
function rowStats(it,p){const L=rowLen(it);const plants=Math.floor(L/p.seedSp+1e-6)+1;let points=0,seeds=0;
  if(p.sow==='点まき'){points=plants;seeds=points*(p.perPoint||0);}else{seeds=Math.ceil(L*(p.perPoint||0));}
  return {L,plants,points,seeds};}
function tally(list){
  const m=new Map();
  for(const it of list){const p=plantById(it.p);if(!p)continue;
    if(!m.has(p.id))m.set(p.id,{p,sd:0,rows:0,len:0,rowPlants:0,points:0,seeds:0});
    const t=m.get(p.id);
    if(it.k==='s')t.sd++;else{const r=rowStats(it,p);t.rows++;t.len+=r.L;t.rowPlants+=r.plants;t.points+=r.points;t.seeds+=r.seeds;}}
  return [...m.values()].sort((a,b)=>a.p.name.localeCompare(b.p.name,'ja'));
}
function itemBox(it,p){if(it.k==='s'){const r=p.seedlingSp/2;return {minX:it.x-r,minY:it.y-r,maxX:it.x+r,maxY:it.y+r};}const w=p.rowSp/2;return {minX:Math.min(it.x1,it.x2)-w,minY:Math.min(it.y1,it.y2)-w,maxX:Math.max(it.x1,it.x2)+w,maxY:Math.max(it.y1,it.y2)+w};}
const up10=v=>Math.ceil(v/10)*10;
function materials(){
  const sup=new Map(); let net=0,netPoles=0,netPoleLen=0; const prot=[];
  for(const it of items()){const p=plantById(it.p);if(!p)continue;
    if(p.support==='支柱'){const n=it.k==='s'?1:rowStats(it,p).plants;const k=p.supLen||150;sup.set(k,(sup.get(k)||0)+n);}
    if(p.support==='ネット'){if(it.k==='r'){const L=rowLen(it);net+=L;netPoles+=Math.ceil(L/180)+1;netPoleLen=Math.max(netPoleLen,p.supLen||180);}else{const k=p.supLen||150;sup.set(k,(sup.get(k)||0)+1);}}
  }
  for(const b of S.beds){
    const groups={};
    for(const it of items()){const p=plantById(it.p);if(!p||p.protect==='なし')continue;if(itemBed(it)!==b)continue;
      const bx=itemBox(it,p);const g=groups[p.protect]||(groups[p.protect]={minX:Infinity,minY:Infinity,maxX:-Infinity,maxY:-Infinity,names:new Set()});
      g.minX=Math.min(g.minX,bx.minX);g.minY=Math.min(g.minY,bx.minY);g.maxX=Math.max(g.maxX,bx.maxX);g.maxY=Math.max(g.maxY,bx.maxY);g.names.add(p.name);}
    for(const k in groups){const g=groups[k];const a=g.maxX-g.minX,c=g.maxY-g.minY;const L=Math.max(a,c),W=Math.min(a,c);
      let spec={};
      if(k==='不織布')spec={sheet:`${up10(L+40)} × ${up10(W+40)}cm`,pins:Math.ceil(2*(L+W+80)/50),area:(L+40)*(W+40)};
      if(k==='トンネル'){const arc=Math.PI*W/2;spec={hoops:Math.ceil(L/50)+1,hoopLen:up10(arc+60),sheet:`${up10(L+W+60)} × ${up10(arc+60)}cm`,pins:Math.ceil(L/50)+1};}
      if(k==='マルチ'){const need=W+30;spec={roll:need<=95?'幅95cm':need<=135?'幅135cm':`幅${up10(need)}cm以上`,len:up10(L+60),pins:Math.ceil(2*L/50)+4};}
      prot.push({bed:b,type:k,L,W,names:[...g.names],spec});}
  }
  return {sup,net,netPoles,netPoleLen,prot};
}

/* ============ キャンバス ============ */
const cv=$('#cv'), cwrap=$('#cwrap'); const ctx=cv.getContext('2d');
let CW=0,CH=0,DPR=1,colors={};
function readColors(){const cs=getComputedStyle(document.documentElement);const g=k=>cs.getPropertyValue(k).trim();
  colors={paper:g('--paper'),panel:g('--panel'),ink:g('--ink'),sub:g('--sub'),leaf:g('--leaf'),pen:g('--pen'),danger:g('--danger'),grid:g('--grid'),gridMajor:g('--gridMajor'),soil:g('--soil'),soilEdge:g('--soilEdge'),line:g('--line')};}
function resize(){const r=cwrap.getBoundingClientRect();DPR=window.devicePixelRatio||1;CW=r.width;CH=r.height;cv.width=Math.round(CW*DPR);cv.height=Math.round(CH*DPR);render();}
let rq=false;function render(){if(rq)return;rq=true;requestAnimationFrame(()=>{rq=false;ctx.setTransform(DPR,0,0,DPR,0,0);drawScene(ctx,CW,CH,V,{});});}

function pill(c,text,x,y,o={}){
  c.font=`${o.bold?'700 ':''}${o.size||12}px -apple-system,"Hiragino Sans",sans-serif`;
  const w=c.measureText(text).width, h=(o.size||12)+6;
  let lx=o.align==='left'?x:o.align==='right'?x-w-8:x-w/2-4;
  if(o.bg!==false){c.fillStyle=o.bg||colors.panel;c.globalAlpha=o.bgAlpha??.9;roundRect(c,lx,y-h/2,w+8,h,5);c.fill();c.globalAlpha=1;}
  c.fillStyle=o.color||colors.ink;c.textBaseline='middle';c.textAlign='left';c.fillText(text,lx+4,y+.5);
}
function roundRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function hexA(hex,a){const h=hex.replace('#','');const n=parseInt(h.length===3?h.split('').map(x=>x+x).join(''):h,16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;}

function drawScene(c,W,H,v,opt){
  const C=colors,s=v.s,X=x=>x*s+v.ox,Y=y=>y*s+v.oy;
  c.fillStyle=C.paper;c.fillRect(0,0,W,H);
  // 罫線
  const g=S.settings.grid,major=g<=10?50:100;
  const x0=-v.ox/s,x1=(W-v.ox)/s,y0=-v.oy/s,y1=(H-v.oy)/s;
  const lines=(step,col)=>{if(step*s<5)return;c.strokeStyle=col;c.lineWidth=1;c.beginPath();
    for(let x=Math.floor(x0/step)*step;x<=x1;x+=step){const px=Math.round(X(x))+.5;c.moveTo(px,0);c.lineTo(px,H);}
    for(let y=Math.floor(y0/step)*step;y<=y1;y+=step){const py=Math.round(Y(y))+.5;c.moveTo(0,py);c.lineTo(W,py);}c.stroke();};
  lines(g,C.grid);lines(major,C.gridMajor);
  // 目盛（m）
  if(major*s>=28&&!opt.export){c.font='10px -apple-system,sans-serif';c.fillStyle=C.sub;c.textBaseline='top';c.textAlign='left';
    for(let x=Math.ceil(x0/major)*major;x<=x1;x+=major)c.fillText(`${fmt(x/100)}m`,X(x)+3,3);
    c.textBaseline='bottom';for(let y=Math.ceil(y0/major)*major;y<=y1;y+=major)c.fillText(`${fmt(y/100)}m`,3,Y(y)-2);}
  // 花壇
  for(const b of S.beds){
    c.beginPath();b.pts.forEach((p,i)=>i?c.lineTo(X(p[0]),Y(p[1])):c.moveTo(X(p[0]),Y(p[1])));c.closePath();
    c.fillStyle=hexA(C.soil.startsWith('#')?C.soil:'#d8c29c',.85);c.fill();
    const isSel=sel&&sel.t==='bed'&&sel.id===b.id;
    c.strokeStyle=isSel?C.leaf:C.soilEdge;c.lineWidth=isSel?3:2;c.stroke();
  }
  // 植物
  const its=items();
  for(const it of its){const p=plantById(it.p);if(!p)continue;const bad=conflicts.has(it.id),isSel=sel&&sel.t==='item'&&sel.id===it.id;
    if(it.k==='r')drawRow(c,v,it,p,bad,isSel);else drawSeedling(c,v,it,p,bad,isSel);}
  // 花壇ラベル
  if(S.settings.showLabels)for(const b of S.beds){
    const bb=bbox(b.pts);pill(c,b.name,X(bb.minX),Y(bb.minY)-12,{align:'left',bold:true,size:12});
    if(b.shape==='circle'){pill(c,`直径 ${fmt(b.c.r*2)}cm`,X(b.c.x),Y(b.c.y+b.c.r)+12,{color:C.pen});}
    else{const sg=Math.sign(sArea(b.pts))||1;
      for(let i=0;i<b.pts.length;i++){const a=b.pts[i],e=b.pts[(i+1)%b.pts.length];const L=Math.hypot(e[0]-a[0],e[1]-a[1]);if(L*s<34)continue;
        const nx=(e[1]-a[1])/L*sg,ny=-(e[0]-a[0])/L*sg;const mx=X((a[0]+e[0])/2)-nx*14,my=Y((a[1]+e[1])/2)-ny*14;
        pill(c,`${fmt(L)}cm`,mx,my,{color:C.pen,size:11});}}
  }
  // 選択寸法
  if(!opt.export&&S.settings.showDims&&sel)drawSelDims(c,v);
  // 頂点ハンドル
  if(!opt.export&&sel&&sel.t==='bed'&&tool==='select'){const b=bedById(sel.id);if(b)handles(b).forEach(h=>{c.beginPath();c.arc(X(h.x),Y(h.y),h.mid?6:9,0,Math.PI*2);c.fillStyle=h.mid?C.panel:C.leaf;c.fill();c.strokeStyle=C.leaf;c.lineWidth=2;c.stroke();});}
  if(!opt.export)drawPreview(c,v);
  // スケールバー
  drawScale(c,W,H,s,opt);
  drawCompass(c,W,opt);
}
function drawSeedling(c,v,it,p,bad,isSel){
  const s=v.s,x=it.x*s+v.ox,y=it.y*s+v.oy,r=p.seedlingSp/2*s;
  c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fillStyle=hexA(p.color,.28);c.fill();
  c.lineWidth=isSel?3:1.5;c.strokeStyle=bad?colors.danger:isSel?colors.pen:hexA(p.color,.95);if(bad)c.setLineDash([5,4]);c.stroke();c.setLineDash([]);
  c.beginPath();c.arc(x,y,Math.max(2.5,Math.min(r*.18,6)),0,Math.PI*2);c.fillStyle=p.color;c.fill();
  if(S.settings.showLabels&&r>=18){c.font=`${r>=34?12:10}px -apple-system,sans-serif`;c.fillStyle=colors.ink;c.textAlign='center';c.textBaseline='top';c.fillText(p.name.slice(0,r>=34?8:4),x,y+Math.min(r*.25,10)+2);}
}
function drawRow(c,v,it,p,bad,isSel){
  const s=v.s,ax=it.x1*s+v.ox,ay=it.y1*s+v.oy,bx=it.x2*s+v.ox,by=it.y2*s+v.oy,w=p.rowSp/2*s;
  c.lineCap='round';c.beginPath();c.moveTo(ax,ay);c.lineTo(bx,by);c.strokeStyle=hexA(p.color,.22);c.lineWidth=w*2;c.stroke();
  if(bad||isSel){c.save();c.lineWidth=w*2+ (isSel?3:2);c.strokeStyle=bad?colors.danger:colors.pen;c.globalAlpha=.35;c.beginPath();c.moveTo(ax,ay);c.lineTo(bx,by);c.stroke();c.restore();
    c.beginPath();c.moveTo(ax,ay);c.lineTo(bx,by);c.strokeStyle=hexA(p.color,.22);c.lineWidth=w*2;c.stroke();}
  c.beginPath();c.moveTo(ax,ay);c.lineTo(bx,by);c.strokeStyle=p.color;c.lineWidth=p.sow==='すじまき'?3:1.5;c.stroke();c.lineCap='butt';
  const L=rowLen(it),n=Math.floor(L/p.seedSp+1e-6)+1,ux=(it.x2-it.x1)/(L||1),uy=(it.y2-it.y1)/(L||1);
  if(p.seedSp*s>=4){for(let i=0;i<n;i++){const px=(it.x1+ux*p.seedSp*i)*s+v.ox,py=(it.y1+uy*p.seedSp*i)*s+v.oy;
    if(p.sow==='点まき'){c.beginPath();c.arc(px,py,Math.max(2.5,Math.min(p.seedSp*s*.2,6)),0,Math.PI*2);c.fillStyle=p.color;c.fill();c.strokeStyle=colors.panel;c.lineWidth=1;c.stroke();}

/* ============ ヒット判定 ============ */
function handles(b){
  if(b.shape==='circle')return [{x:b.c.x+b.c.r,y:b.c.y,i:0}];
  const h=b.pts.map((p,i)=>({x:p[0],y:p[1],i}));
  if(b.shape==='poly')b.pts.forEach((p,i)=>{const q=b.pts[(i+1)%b.pts.length];h.push({x:(p[0]+q[0])/2,y:(p[1]+q[1])/2,i,mid:true});});
  return h;
}
function hitHandle(b,sp){let best=null,bd=22;for(const h of handles(b)){const d=Math.hypot(h.x*V.s+V.ox-sp.x,h.y*V.s+V.oy-sp.y);if(d<bd){bd=d;best=h;}}return best;}
function hitItem(w){const tol=14/V.s;const its=items();for(let i=its.length-1;i>=0;i--){const it=its[i],p=plantById(it.p);if(!p)continue;
  if(it.k==='s'){if(Math.hypot(w.x-it.x,w.y-it.y)<=Math.max(p.seedlingSp/2,tol))return it;}
  else if(dPS(w.x,w.y,[it.x1,it.y1],[it.x2,it.y2])<=Math.max(p.rowSp/2,tol))return it;}return null;}
function hitBed(w){return bedOfPoint(w.x,w.y);}

/* ============ 入力 ============ */
const toW=p=>({x:(p.x-V.ox)/V.s,y:(p.y-V.oy)/V.s});
const snapV=v=>{const st=S.settings.snap;return st>0?Math.round(v/st)*st:Math.round(v*10)/10;};
const snapP=w=>[snapV(w.x),snapV(w.y)];
function evPos(e){const r=cv.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}
const ptrs=new Map();let pinch=null,action=null,afterPinch=false;

cv.addEventListener('pointerdown',e=>{
  e.preventDefault();try{cv.setPointerCapture(e.pointerId);}catch(_){}
  ptrs.set(e.pointerId,evPos(e));
  if(ptrs.size===2){cancelAction();const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1,s:V.s,m:{x:(a.x+b.x)/2,y:(a.y+b.y)/2},ox:V.ox,oy:V.oy};afterPinch=true;return;}
  if(ptrs.size===1){afterPinch=false;startAction(evPos(e));}
});
cv.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,evPos(e));
  if(pinch&&ptrs.size>=2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y)||1;const m={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
    const ns=clamp(pinch.s*d/pinch.d,0.15,40);const wx=(pinch.m.x-pinch.ox)/pinch.s,wy=(pinch.m.y-pinch.oy)/pinch.s;V.s=ns;V.ox=m.x-wx*ns;V.oy=m.y-wy*ns;render();return;}
  if(action&&!afterPinch)moveAction(evPos(e));
});
function ptrEnd(e){if(!ptrs.has(e.pointerId))return;const p=evPos(e);ptrs.delete(e.pointerId);
  if(pinch){if(ptrs.size<2)pinch=null;return;}
  if(action&&!afterPinch)endAction(p,e.type==='pointercancel');}
cv.addEventListener('pointerup',ptrEnd);cv.addEventListener('pointercancel',ptrEnd);
cv.addEventListener('wheel',e=>{e.preventDefault();const p=evPos(e);const f=Math.exp(-e.deltaY*0.0015);const ns=clamp(V.s*f,0.15,40);const wx=(p.x-V.ox)/V.s,wy=(p.y-V.oy)/V.s;V.s=ns;V.ox=p.x-wx*ns;V.oy=p.y-wy*ns;render();},{passive:false});
['gesturestart','gesturechange'].forEach(t=>document.addEventListener(t,e=>e.preventDefault()));

function needPlant(m){const p=plantById(active.pid);if(!p||active.m!==m){toast(m==='s'?'植物タブで苗を置く植物の「苗」を選んでください':'植物タブで播種する植物の「播種」を選んでください');openPanel('plants');return null;}return p;}
function startAction(sp){
  const w=toW(sp);const base={start:sp,moved:false};
  switch(tool){
    case 'select':{
      if(sel&&sel.t==='bed'){const b=bedById(sel.id);const h=b&&hitHandle(b,sp);if(h){action={...base,kind:'vertex',bed:b,h,snap:snapshot()};return;}}
      const it=hitItem(w);if(it){select({t:'item',id:it.id});action={...base,kind:'moveItem',it,orig:{...it},w0:w,valid:true,snap:snapshot()};return;}
      const b=hitBed(w);if(b){const wasSel=sel&&sel.t==='bed'&&sel.id===b.id;select({t:'bed',id:b.id});
        const inBed=[];S.plans.forEach(pl=>pl.items.forEach(i=>{if(itemBed(i)===b)inBed.push({i,o:{...i}});}));
        action={...base,kind:'moveBed',bed:b,pts0:b.pts.map(p=>[...p]),c0:b.c?{...b.c}:null,inBed,w0:w,snap:snapshot(),wasSel};return;}
      action={...base,kind:'pan',ox:V.ox,oy:V.oy};return;}
    case 'rect':case 'circle':{const q=snapP(w);action={...base,kind:tool,a:q,b:q};render();return;}
    case 'poly':{action={...base,kind:'poly',p:snapP(w)};render();return;}
    case 'seedling':{const p=needPlant('s');if(!p)return;const q=snapP(w);const r=checkCircle(q[0],q[1],p.seedlingSp/2,obstacles());action={...base,kind:'seed',p:q,ok:r.ok,msg:r.msg};render();return;}
    case 'row':{const p=needPlant('r');if(!p)return;const q=snapP(w);action={...base,kind:'row',a:q,b:q,fit:null};render();return;}
    case 'measure':{const q=snapP(w);action={...base,kind:'measure',a:q,b:q};measure=null;render();return;}
    default:action={...base,kind:'tap'};
  }
}
function moveAction(sp){
  const A=action;if(!A)return;if(Math.hypot(sp.x-A.start.x,sp.y-A.start.y)>6)A.moved=true;
  const w=toW(sp);
  switch(A.kind){
    case 'pan':V.ox=A.ox+sp.x-A.start.x;V.oy=A.oy+sp.y-A.start.y;break;
    case 'moveItem':{if(!A.moved)return;const it=A.it,o=A.orig,dx=w.x-A.w0.x,dy=w.y-A.w0.y;
      if(it.k==='s'){it.x=snapV(o.x+dx);it.y=snapV(o.y+dy);}else{const nx=snapV(o.x1+dx)-o.x1,ny=snapV(o.y1+dy)-o.y1;it.x1=o.x1+nx;it.y1=o.y1+ny;it.x2=o.x2+nx;it.y2=o.y2+ny;}

    case 'moveBed':{if(!A.moved)return;const dx=snapV(w.x-A.w0.x),dy=snapV(w.y-A.w0.y);A.bed.pts=A.pts0.map(p=>[p[0]+dx,p[1]+dy]);if(A.c0)A.bed.c={x:A.c0.x+dx,y:A.c0.y+dy,r:A.c0.r};
      A.inBed.forEach(({i,o})=>{if(i.k==='s'){i.x=o.x+dx;i.y=o.y+dy;}else{i.x1=o.x1+dx;i.y1=o.y1+dy;i.x2=o.x2+dx;i.y2=o.y2+dy;}});A.dirty=true;computeConflicts();break;}
    case 'vertex':{const b=A.bed,q=snapP(w);A.dirty=true;
      if(b.shape==='circle'){const r=Math.max(5,snapV(Math.hypot(q[0]-b.c.x,q[1]-b.c.y)));b.c.r=r;b.pts=circPts(b.c.x,b.c.y,r);}
      else if(b.shape==='rect'){const opp=A.opp||(A.opp=b.pts[(A.h.i+2)%4].slice());b.pts=rectPts(opp[0],opp[1],q[0],q[1]);}
      else{if(A.h.mid&&!A.inserted){b.pts.splice(A.h.i+1,0,q);A.h={...A.h,i:A.h.i+1,mid:false};A.inserted=true;}b.pts[A.h.i]=q;}

    case 'rect':case 'circle':A.b=snapP(w);break;
    case 'poly':A.p=snapP(w);break;
    case 'seed':{const p=plantById(active.pid);A.p=snapP(w);const r=checkCircle(A.p[0],A.p[1],p.seedlingSp/2,obstacles());A.ok=r.ok;A.msg=r.msg;break;}
    case 'row':{const p=plantById(active.pid);let b=[w.x,w.y];let dx=b[0]-A.a[0],dy=b[1]-A.a[1];let L=Math.hypot(dx,dy),ang=Math.atan2(dy,dx);
      if(S.settings.angleSnap){const st=Math.PI/4,sn=Math.round(ang/st)*st;if(Math.abs(sn-ang)<0.12)ang=sn;}
      L=S.settings.snap>0?Math.round(L/S.settings.snap)*S.settings.snap:L;b=[A.a[0]+Math.cos(ang)*L,A.a[1]+Math.sin(ang)*L].map(v=>Math.round(v*10)/10);
      A.b=b;A.fit=L>0?fitRow(A.a,b,p.rowSp/2,obstacles()):null;break;}
    case 'measure':A.b=snapP(w);break;
  }
  render();
}
function endAction(sp,cancelled){

    case 'pan':if(!A.moved){select(null);}break;
    case 'moveItem':if(A.moved){if(!A.valid){restore(A.snap);toast(A.msg||'ここには置けません');}else{pushUndo(A.snap);}changed();}break;
    case 'moveBed':if(A.moved){pushUndo(A.snap);changed();}break;
    case 'vertex':if(A.dirty){if(Math.abs(sArea(A.bed.pts))<50){restore(A.snap);toast('花壇が小さすぎます');}else pushUndo(A.snap);changed();}break;
    case 'rect':{const P=rectPts(A.a[0],A.a[1],A.b[0],A.b[1]);const bb=bbox(P);if(bb.w<10||bb.h<10){toast('10cm以上の大きさでドラッグしてください');break;}
      pushUndo();const b={id:uid(),name:nextBedName(),shape:'rect',pts:P};S.beds.push(b);sel={t:'bed',id:b.id};changed();toast(`${b.name}（${fmt(bb.w)}×${fmt(bb.h)}cm）を作成`);break;}
    case 'circle':{const r=Math.hypot(A.b[0]-A.a[0],A.b[1]-A.a[1]);if(r<5){toast('中心から外側へドラッグしてください');break;}
      pushUndo();const b={id:uid(),name:nextBedName(),shape:'circle',c:{x:A.a[0],y:A.a[1],r},pts:circPts(A.a[0],A.a[1],r)};S.beds.push(b);sel={t:'bed',id:b.id};changed();break;}
    case 'poly':{const q=A.p;if(polyPts.length>=3){const f=polyPts[0];if(Math.hypot((f[0]-q[0])*V.s,(f[1]-q[1])*V.s)<24){finishPoly();break;}}
      const l=polyPts[polyPts.length-1];if(!l||l[0]!==q[0]||l[1]!==q[1])polyPts.push(q);updateHint();break;}
    case 'seed':{const p=plantById(active.pid);if(!A.ok){toast(A.msg||'ここには置けません');break;}pushUndo();const it={id:uid(),k:'s',p:p.id,x:A.p[0],y:A.p[1]};items().push(it);seasonWarn(p,'s');changed();break;}
    case 'row':{const p=plantById(active.pid);if(!A.fit||!A.fit.ok){if(A.moved)toast((A.fit&&A.fit.msg)||'ドラッグして条を引いてください');else toast('ドラッグして条（すじ）を引いてください');break;}
      const e=A.fit.b;if(Math.hypot(e[0]-A.a[0],e[1]-A.a[1])<5){toast('5cm以上の長さが必要です');break;}
      pushUndo();items().push({id:uid(),k:'r',p:p.id,x1:A.a[0],y1:A.a[1],x2:Math.round(e[0]*10)/10,y2:Math.round(e[1]*10)/10});seasonWarn(p,'r');changed();break;}
    case 'measure':measure={a:A.a,b:A.b};break;
    case 'tap':{if(A.moved)break;
      if(tool==='fill'){const b=hitBed(w);if(!b){toast('花壇をタップしてください');break;}autoFill(b);}
      if(tool==='erase'){const it=hitItem(w);if(it){pushUndo();plan().items=items().filter(i=>i!==it);if(sel&&sel.id===it.id)sel=null;changed();break;}
        const b=hitBed(w);if(b)askConfirm(`${b.name}を削除しますか？中の植物（全プラン）も削除されます。`,()=>deleteBed(b));}
      break;}
  }
  render();
}
function cancelAction(){if(action){if(action.snap&&action.dirty){restore(action.snap);computeConflicts();}action=null;render();}}
function finishPoly(){if(polyPts.length<3){toast('3点以上必要です');return;}const P=polyPts.slice();if(Math.abs(sArea(P))<50){toast('花壇が小さすぎます');return;}
  pushUndo();const b={id:uid(),name:nextBedName(),shape:'poly',pts:P};S.beds.push(b);polyPts=[];sel={t:'bed',id:b.id};changed();updateHint();}
function nextBedName(){const used=new Set(S.beds.map(b=>b.name));for(let i=0;i<26;i++){const n='花壇'+String.fromCharCode(65+i);if(!used.has(n))return n;}return '花壇'+(S.beds.length+1);}
function seasonWarn(p,m){const mo=S.settings.month;const ok=m==='s'?p.plantM.includes(mo):p.seedM.includes(mo);if(!ok)toast(`${p.name}の${m==='s'?'植え付け':'種まき'}適期は${fmtMonths(m==='s'?p.plantM:p.seedM)}です`);}
function deleteBed(b){pushUndo();S.plans.forEach(pl=>{pl.items=pl.items.filter(i=>itemBed(i)!==b);});S.beds=S.beds.filter(x=>x!==b);if(sel&&sel.id===b.id)sel=null;changed();}

/* ============ 自動配置 ============ */
function autoFill(b){
  const p=plantById(active.pid);if(!p||!active.m){toast('植物タブで植物と「苗」または「播種」を選んでください');openPanel('plants');return;}
  const bb=bbox(b.pts);const base=obstacles().filter(o=>{const m=o.k==='s'?o.r:o.w+Math.max(Math.abs(o.a[0]-o.b[0]),Math.abs(o.a[1]-o.b[1]));const x=o.k==='s'?o.x:o.a[0],y=o.k==='s'?o.y:o.a[1];return x>bb.minX-m-120&&x<bb.maxX+m+120&&y>bb.minY-m-120&&y<bb.maxY+m+120;});
  const t0=performance.now();let added=[];
  if(active.m==='s'){
    const s=p.seedlingSp,r=s/2,hex=S.settings.pattern==='hex',dy=hex?s*Math.sqrt(3)/2:s;
    const est=(bb.w/s)*(bb.h/dy);const K=est>400?1:est>150?2:4;let best=[];
    for(let ix=0;ix<K;ix++)for(let iy=0;iy<K;iy++){const obs=base.slice(),pts=[];let row=0;
      for(let y=bb.minY+r+iy*dy/K;y<=bb.maxY-r+EPS;y+=dy,row++){const sh=hex&&row%2?s/2:0;
        for(let x=bb.minX+r+ix*s/K+sh-(hex&&row%2&&ix*s/K+sh>=s?s:0);x<=bb.maxX-r+EPS;x+=s){const q=[Math.round(x*10)/10,Math.round(y*10)/10];
          if(checkCircle(q[0],q[1],r,obs,b).ok){pts.push(q);obs.push({k:'s',x:q[0],y:q[1],r});}}}
      if(pts.length>best.length)best=pts;if(performance.now()-t0>2500)break;}
    added=best.map(q=>({id:uid(),k:'s',p:p.id,x:q[0],y:q[1]}));
  }else{
    const w=p.rowSp/2,step=p.rowSp;let dir=S.settings.rowDir;if(dir==='auto')dir=bb.w>=bb.h?'h':'v';
    const along=dir==='h'?[bb.minX,bb.maxX]:[bb.minY,bb.maxY],across=dir==='h'?[bb.minY,bb.maxY]:[bb.minX,bb.maxX];
    const P=(u,c)=>dir==='h'?[u,c]:[c,u];let best={len:0,rows:[]};
    for(let k=0;k<3;k++){const obs=base.slice(),rows=[];let tot=0;
      for(let c=across[0]+w+k*step/3;c<=across[1]-w+EPS;c+=step){let runS=null,last=null;const cc=Math.round(c*10)/10;
        const flush=()=>{if(runS!==null&&last-runS>=Math.max(10,p.seedSp)){let a=P(runS,cc),e=P(last,cc);let ok=checkRow(a,e,w,obs,b).ok,tries=0;
            while(!ok&&tries<6){runS+=0.5;last-=0.5;a=P(runS,cc);e=P(last,cc);ok=last>runS&&checkRow(a,e,w,obs,b).ok;tries++;}
            if(ok){rows.push([a,e]);obs.push({k:'r',a,b:e,w});tot+=last-runS;}}runS=null;last=null;};
        for(let u=Math.ceil(along[0]);u<=along[1];u+=1){const q=P(u,cc);if(checkCircle(q[0],q[1],w,obs,b).ok){if(runS===null)runS=u;last=u;}else flush();}
        flush();}
      if(tot>best.len)best={len:tot,rows};}
    added=best.rows.map(([a,e])=>({id:uid(),k:'r',p:p.id,x1:a[0],y1:a[1],x2:e[0],y2:e[1]}));
  }
  if(!added.length){toast('空いている場所がありません（間隔が足りません）');return;}
  pushUndo();plan().items.push(...added);seasonWarn(p,active.m);changed();
  toast(`${p.name}を${active.m==='s'?added.length+'株':added.length+'条'}自動配置しました`);
}

  const sd=t.reduce((a,x)=>a+x.sd,0),rp=t.reduce((a,x)=>a+x.rowPlants,0),rl=t.reduce((a,x)=>a+x.len,0);
  h+=`<div class="scroll"><table><tr><th>植物</th><th class="n">苗</th><th class="n">播種</th><th class="n">株数計</th></tr>${t.map(x=>`<tr><td><span class="dot" style="display:inline-block;background:${x.p.color};vertical-align:-2px"></span> ${esc(x.p.name)}</td>
    <td class="n">${x.sd?x.sd+'株':''}</td><td class="n">${x.rows?`${x.rows}条 ${fmt(x.len)}cm<br><span class="muted">${x.p.sow==='点まき'?`${x.points}穴・${x.seeds}粒`:`約${x.seeds}粒`}</span>`:''}</td><td class="n"><b>${x.sd+x.rowPlants}</b></td></tr>`).join('')}
    <tr><td><b>合計</b></td><td class="n"><b>${sd}株</b></td><td class="n"><b>${fmt(rl/100)}m</b></td><td class="n"><b>${sd+rp}</b></td></tr></table></div>
    <p class="muted">播種の株数は間引き後（株間ごと）の仕上がり数です。</p>`;
  if(conflicts.size)h+=`<div class="box bad">間隔が重なっている植物が${conflicts.size}件あります（赤い破線）。</div>`;
  h+=companionHtml();
  h+=`<h3>位置合わせ寸法</h3><p class="muted">各花壇の外形の左上角を0とした距離（cm）。メジャーを2方向に当てて印を付けます。</p>`;
  for(const b of S.beds){const list=items().filter(i=>itemBed(i)===b);if(!list.length)continue;const o=relOf(b);
    const rows=list.map(i=>({i,p:plantById(i.p),y:i.k==='s'?i.y:Math.min(i.y1,i.y2),x:i.k==='s'?i.x:Math.min(i.x1,i.x2)})).sort((a,c)=>a.y-c.y||a.x-c.x);
    h+=`<details ${S.beds.length<=2?'open':''}><summary>${esc(b.name)}（${list.length}件）</summary><div class="scroll"><table><tr><th>植物</th><th class="n">左から</th><th class="n">上から</th><th class="n">長さ</th></tr>
    ${rows.map(({i,p})=>i.k==='s'?`<tr><td>● ${esc(p.name)}</td><td class="n">${fmt(i.x-o.x)}</td><td class="n">${fmt(i.y-o.y)}</td><td></td></tr>`:
      `<tr><td>━ ${esc(p.name)}<br><span class="muted">始点→終点</span></td><td class="n">${fmt(i.x1-o.x)}<br>${fmt(i.x2-o.x)}</td><td class="n">${fmt(i.y1-o.y)}<br>${fmt(i.y2-o.y)}</td><td class="n">${fmt(rowLen(i))}</td></tr>`).join('')}</table></div></details>`;}
  h+=calendarHtml(t.map(x=>x.p));
  return h;}
function companionHtml(){const its=items().map(i=>({i,p:plantById(i.p),s:shapeOf(i)})).filter(x=>x.p&&x.s);const bad=new Set(),good=new Set();
  const gap=(a,b)=>{if(a.k==='s'&&b.k==='s')return Math.hypot(a.x-b.x,a.y-b.y)-a.r-b.r;if(a.k==='s')return dPS(a.x,a.y,b.a,b.b)-a.r-b.w;if(b.k==='s')return dPS(b.x,b.y,a.a,a.b)-b.r-a.w;return dSS(a.a,a.b,b.a,b.b)-a.w-b.w;};
  const has=(n,k)=>n.includes(k);
  for(let x=0;x<its.length;x++)for(let y=x+1;y<its.length;y++){const A=its[x],B=its[y];if(A.p===B.p)continue;
    const pr=(L)=>L.find(([u,v])=>(has(A.p.name,u)&&has(B.p.name,v))||(has(A.p.name,v)&&has(B.p.name,u)));
    const bp=pr(BAD_PAIRS),gp=pr(GOOD_PAIRS);if(!bp&&!gp)continue;if(gap(A.s,B.s)>40)continue;
    const key=[A.p.name,B.p.name].sort().join('と');if(bp)bad.add(key);else good.add(key);}
  if(!bad.size&&!good.size)return '';
  return `<h3>相性チェック（40cm以内）</h3>${[...bad].map(k=>`<div class="bad">▲ ${esc(k)}：近くに植えるのは避けたい組み合わせ</div>`).join('')}${[...good].map(k=>`<div class="good">◎ ${esc(k)}：相性の良い組み合わせ</div>`).join('')}<p class="muted">一般的な目安です。</p>`;}
function calendarHtml(ps){if(!ps.length)ps=S.plants.filter(p=>items().some(i=>i.p===p.id));if(!ps.length)return '';const m=S.settings.month;
  return `<h3>作業カレンダー</h3><div class="legend"><span><i class="dot" style="background:#f1d27a"></i>播種</span><span><i class="dot" style="background:#9fd39b"></i>植え付け</span><span><i class="dot" style="background:#e9a07c"></i>収穫</span></div>
  <div class="scroll"><table class="cal"><tr><th></th>${Array.from({length:12},(_,i)=>`<th class="${i+1===m?'cur':''}">${i+1}</th>`).join('')}</tr>
  ${ps.map(p=>`<tr><td class="nm">${esc(p.name)}</td>${Array.from({length:12},(_,i)=>{const k=i+1;const c=p.harvM.includes(k)?'h':p.plantM.includes(k)?'p':p.seedM.includes(k)?'s':'';const t=[p.seedM.includes(k)?'播':'',p.plantM.includes(k)?'植':'',p.harvM.includes(k)?'収':''].join('');return `<td class="${c}">${t}</td>`;}).join('')}</tr>`).join('')}</table></div>`;}

    ${g.type==='マルチ'?`<div class="row between"><span>マルチフィルム</span><b>${s.roll} × ${s.len}cm</b></div><div class="row between"><span>マルチ押さえピン</span><b>${s.pins}本</b></div>`:''}</div>`;});
  const tot=S.beds.reduce((a,b)=>a+bedArea(b),0)/10000;const st=S.settings;
  h+=`<h3>土づくり（全花壇 ${fmt(tot)}㎡）</h3><table><tr><th>花壇</th><th class="n">面積</th><th class="n">堆肥</th><th class="n">苦土石灰</th><th class="n">元肥</th></tr>
    ${S.beds.map(b=>{const a=bedArea(b)/10000;return `<tr><td>${esc(b.name)}</td><td class="n">${fmt(a)}㎡</td><td class="n">${fmt(a*st.compost)}kg</td><td class="n">${Math.round(a*st.lime)}g</td><td class="n">${Math.round(a*st.fert)}g</td></tr>`;}).join('')}
    <tr><td><b>合計</b></td><td class="n"><b>${fmt(tot)}㎡</b></td><td class="n"><b>${fmt(tot*st.compost)}kg</b></td><td class="n"><b>${Math.round(tot*st.lime)}g</b></td><td class="n"><b>${Math.round(tot*st.fert)}g</b></td></tr></table>
    <p class="muted">1㎡あたり 堆肥${st.compost}kg・苦土石灰${st.lime}g・元肥${st.fert}g で計算（設定で変更可）。</p>`;
  const t=tally(items());if(t.length){h+=`<h3>購入リスト</h3><table>${t.map(x=>`<tr><td>${esc(x.p.name)}</td><td class="n">${x.sd?`苗 ${x.sd}株`:''}${x.sd&&x.rows?'・':''}${x.rows?`種 ${x.seeds}粒`:''}</td></tr>`).join('')}</table><p class="muted">苗は予備に1〜2割多めがおすすめです。</p>`;}
  h+=`<p class="muted">資材量は植え付け範囲からの目安です。</p>`;return h;}

/* パネルのイベント */
const pbody=$('#pbody');
pbody.addEventListener('input',e=>{if(e.target.id==='pq'){ui.q=e.target.value;$('#plist').innerHTML=plantList();}});
pbody.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.set){const k=t.dataset.set;let v=t.type==='checkbox'?t.checked:t.value;if(typeof DEF[k]==='number')v=+v||0;S.settings[k]=v;if(k==='theme')applyTheme();save();render();if(k==='showAllSeasons')refreshPanel();return;}
  if(t.dataset.plan){S.plans[+t.dataset.plan].name=t.value||'プラン';save();fillSelects();return;}
  if(t.dataset.bed){const b=bedById(sel.id);if(!b)return;const k=t.dataset.bed,v=+t.value;pushUndo();
    if(k==='name')b.name=t.value||b.name;
    else if(v>=10){const bb=bbox(b.pts);if(k==='w')b.pts=rectPts(bb.minX,bb.minY,bb.minX+v,bb.maxY);if(k==='h')b.pts=rectPts(bb.minX,bb.minY,bb.maxX,bb.minY+v);if(k==='d'){b.c.r=v/2;b.pts=circPts(b.c.x,b.c.y,b.c.r);}}
    else{undoS.pop();toast('10cm以上を入力してください');}
    changed();return;}
  if(t.dataset.it){const it=itemById(sel.id);if(!it)return;const p=plantById(it.p);const b=itemBed(it);const o=b?relOf(b):{x:0,y:0};const k=t.dataset.it,v=parseFloat(t.value);if(isNaN(v))return refreshPanel();
    const snap=snapshot();const c={...it};
    if(k==='x')c.x=o.x+v;if(k==='y')c.y=o.y+v;if(k==='x1')c.x1=o.x+v;if(k==='y1')c.y1=o.y+v;if(k==='x2')c.x2=o.x+v;if(k==='y2')c.y2=o.y+v;
    if(k==='len'){const L=rowLen(it)||1;c.x2=it.x1+(it.x2-it.x1)/L*v;c.y2=it.y1+(it.y2-it.y1)/L*v;}
    const r=checkItem(c,obstacles(it.id));if(!r.ok){toast(r.msg||'その位置には置けません');refreshPanel();return;}
    pushUndo(snap);Object.assign(it,c);changed();}
});
pbody.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='pick'){const p=plantById(b.dataset.id);active={pid:p.id,m:b.dataset.m};setTool(b.dataset.m==='s'?'seedling':'row');refreshPanel();if(innerWidth<=760)$('#panel').classList.add('hidden'),resize();return;}
  if(a==='editPlant')return plantEditor(plantById(b.dataset.id));
  if(a==='newPlant')return plantEditor(null);
  if(a==='presets')return presetsModal();
  if(a==='csv')return csvModal();
  if(a==='table')return tableModal();
  if(a==='addBed'){const sh=$('#nbS').value,w=+$('#nbW').value,h=+$('#nbH').value;if(!(w>=10)||(sh==='rect'&&!(h>=10)))return toast('10cm以上を入力してください');
    const all=S.beds.flatMap(x=>x.pts);const x0=all.length?bbox(all).maxX+60:0,y0=all.length?bbox(all).minY:0;pushUndo();
    const nb=sh==='rect'?{id:uid(),name:nextBedName(),shape:'rect',pts:rectPts(x0,y0,x0+w,y0+h)}:{id:uid(),name:nextBedName(),shape:'circle',c:{x:x0+w/2,y:y0+w/2,r:w/2},pts:circPts(x0+w/2,y0+w/2,w/2)};
    S.beds.push(nb);sel={t:'bed',id:nb.id};changed();fitView();return;}
  if(a==='fillBed'){const bd=bedById(sel.id);if(bd)autoFill(bd);return;}
  if(a==='dupBed'){const bd=bedById(sel.id);const bb=bbox(bd.pts);const dx=bb.w+60;pushUndo();const nb=JSON.parse(JSON.stringify(bd));nb.id=uid();nb.name=nextBedName();nb.pts=nb.pts.map(p=>[p[0]+dx,p[1]]);if(nb.c)nb.c.x+=dx;S.beds.push(nb);sel={t:'bed',id:nb.id};changed();fitView();return;}
  if(a==='clearBed'){const bd=bedById(sel.id);askConfirm(`${bd.name}の植物（${plan().name}）をすべて外しますか？`,()=>{pushUndo();plan().items=items().filter(i=>itemBed(i)!==bd);changed();});return;}
  if(a==='delBed'){const bd=bedById(sel.id);askConfirm(`${bd.name}を削除しますか？中の植物（全プラン）も削除されます。`,()=>deleteBed(bd));return;}
  if(a==='delItem'){pushUndo();plan().items=items().filter(i=>i.id!==sel.id);sel=null;changed();return;}
  if(a==='dupItem')return dupItem();
  if(a==='addPlan'){pushUndo();S.plans.push({id:uid(),name:`プラン${S.plans.length+1}`,items:[]});S.activePlan=S.plans.length-1;changed();return;}
  if(a==='dupPlan'){const i=+b.dataset.i;pushUndo();const np=JSON.parse(JSON.stringify(S.plans[i]));np.id=uid();np.name+='（複製）';np.items.forEach(x=>x.id=uid());S.plans.splice(i+1,0,np);S.activePlan=i+1;changed();return;}
  if(a==='delPlan'){const i=+b.dataset.i;askConfirm(`「${S.plans[i].name}」を削除しますか？`,()=>{pushUndo();S.plans.splice(i,1);S.activePlan=0;sel=null;changed();});return;}
  if(a==='image')return exportImage();
  if(a==='export')return exportData();
  if(a==='import')return importData();
  if(a==='reset')return askConfirm('すべてのデータを消して初期状態に戻しますか？（元に戻すで復元できます）',()=>{pushUndo();const n=newState();S.beds=n.beds;S.plants=n.plants;S.plans=n.plans;S.activePlan=0;sel=null;active={pid:null,m:null};changed();fitView();});
});
function dupItem(){const it=itemById(sel.id);const p=plantById(it.p);let c=null;
  if(it.k==='s'){const s=p.seedlingSp;for(const [dx,dy] of [[s,0],[0,s],[-s,0],[0,-s],[s/2,s*0.866],[-s/2,s*0.866]]){const t={...it,id:uid(),x:it.x+dx,y:it.y+dy};if(checkItem(t,obstacles()).ok){c=t;break;}}}
  else{const L=rowLen(it)||1,nx=-(it.y2-it.y1)/L*p.rowSp,ny=(it.x2-it.x1)/L*p.rowSp;for(const k of [1,-1]){const t={...it,id:uid(),x1:it.x1+nx*k,y1:it.y1+ny*k,x2:it.x2+nx*k,y2:it.y2+ny*k};if(checkItem(t,obstacles()).ok){c=t;break;}}}
  if(!c)return toast('隣に置けるスペースがありません');pushUndo();items().push(c);sel={t:'item',id:c.id};changed();}

  <div class="fld"><label>まき方</label><select class="inp" id="fSw">${opt(['点まき','すじまき'],p.sow)}</select></div><div class="fld"><label>粒数（点まき:1か所 / すじ:1cmあたり）</label><input class="inp" id="fPP" type="number" inputmode="decimal" value="${p.perPoint}"></div></div>
  <h3>苗の植え付け — 円で描画</h3><div class="fld"><label>植え付けの時期</label>${monthsPicker('plantM',p.plantM)}</div>
  <div class="fld"><label>株間 cm（円の直径）</label><input class="inp" id="fPS" type="number" inputmode="decimal" value="${p.seedlingSp}"></div>
  <h3>収穫と資材</h3><div class="fld"><label>収穫の時期</label>${monthsPicker('harvM',p.harvM)}</div>
  <div class="grid3"><div class="fld"><label>支柱</label><select class="inp" id="fSu">${opt(SUPPORTS,p.support)}</select></div><div class="fld"><label>支柱の長さ cm</label><input class="inp" id="fSL" type="number" inputmode="decimal" value="${p.supLen}"></div><div class="fld"><label>防寒・防虫など</label><select class="inp" id="fPr">${opt(PROTECTS,p.protect)}</select></div></div>
  <div class="fld"><label>メモ</label><input class="inp" id="fM" value="${esc(p.memo||'')}"></div>
  <p class="muted">種まきの時期が空欄なら「播種」、植え付けの時期が空欄なら「苗」は選べません。</p>`,
  `${isNew?'':`<button class="btn dan" id="fDel">削除</button>`}<button class="btn" data-close>やめる</button><button class="btn pri" id="fSave">保存する</button>`);
  $$('#mb .months button').forEach(x=>x.onclick=()=>x.classList.toggle('on'));
  const mk=k=>$$(`#mb [data-mk="${k}"] button.on`).map(x=>+x.dataset.mv);
  $('#fSave').onclick=()=>{const name=$('#fN').value.trim();if(!name)return toast('名前を入力してください');
    const np={...p,name,cat:$('#fK').value,color:$('#fC').value,seedM:mk('seedM'),plantM:mk('plantM'),harvM:mk('harvM'),rowSp:+$('#fRS').value||0,seedSp:+$('#fSS').value||0,sow:$('#fSw').value,perPoint:+$('#fPP').value||0,
      seedlingSp:+$('#fPS').value||0,support:$('#fSu').value,supLen:+$('#fSL').value||0,protect:$('#fPr').value,memo:$('#fM').value};
    if(np.seedM.length&&(!np.rowSp||!np.seedSp))return toast('播種する場合は条間と株間を入力してください');
    if(np.plantM.length&&!np.seedlingSp)return toast('苗を植える場合は株間を入力してください');
    pushUndo();if(isNew)S.plants.push(np);else Object.assign(p,np);closeModal();changed();toast(`${name}を保存しました`);};
  if(!isNew)$('#fDel').onclick=()=>{const n=S.plans.reduce((a,pl)=>a+pl.items.filter(i=>i.p===p.id).length,0);closeModal();
    askConfirm(`${p.name}を削除しますか？${n?`配置済みの${n}件も消えます。`:''}`,()=>{pushUndo();S.plants=S.plants.filter(x=>x!==p);S.plans.forEach(pl=>pl.items=pl.items.filter(i=>i.p!==p.id));if(active.pid===p.id)active={pid:null,m:null};changed();});};
}
function presetsModal(){const have=new Set(S.plants.map(p=>p.name));const list=PRESETS.filter(a=>!have.has(a[0]));
  if(!list.length){openModal('候補からまとめて追加','<p>候補はすべて登録済みです。</p>');return;}
  openModal('候補からまとめて追加',`<p class="muted">追加したいものにチェック。時期や間隔は一般的な目安（中間地）です。登録後に編集できます。</p>
  <label class="sw"><input type="checkbox" id="psAll">すべて選ぶ</label>
  ${CATS.map(c=>{const r=list.filter(a=>a[1]===c);return r.length?`<h3>${c}</h3>`+r.map(a=>{const p=mkPlant(a);return `<label class="pl" style="cursor:pointer"><input type="checkbox" class="ps" value="${esc(a[0])}" style="width:24px;height:24px;accent-color:var(--leaf)"><span class="dot" style="background:${a[13]}"></span><span class="nm"><b>${esc(a[0])}</b><span>${hasSeed(p)?`播種${fmtMonths(p.seedM)} 条間${p.rowSp}/株間${p.seedSp}`:''} ${hasSeedling(p)?`苗${fmtMonths(p.plantM)} 株間${p.seedlingSp}`:''}</span></span></label>`;}).join(''):'';}).join('')}`,
  `<button class="btn" data-close>やめる</button><button class="btn pri" id="psAdd">チェックしたものを追加</button>`);
  $('#psAll').onchange=e=>$$('#mb .ps').forEach(x=>x.checked=e.target.checked);
  $('#psAdd').onclick=()=>{const names=$$('#mb .ps:checked').map(x=>x.value);if(!names.length)return toast('1つ以上選んでください');pushUndo();
    PRESETS.filter(a=>names.includes(a[0])).forEach(a=>S.plants.push(mkPlant(a)));closeModal();changed();toast(`${names.length}件を追加しました`);};}
const CSV_HEAD='名前,分類,播種月,植付月,収穫月,条間cm,株間cm(播種),まき方,粒数,苗の株間cm,支柱,支柱長cm,資材,色';
function plantToCsv(p){return [p.name,p.cat,fmtMonths(p.seedM).replace('月','').replace(/・/g,'/'),fmtMonths(p.plantM).replace('月','').replace(/・/g,'/'),fmtMonths(p.harvM).replace('月','').replace(/・/g,'/'),p.rowSp,p.seedSp,p.sow,p.perPoint,p.seedlingSp,p.support,p.supLen,p.protect,p.color].join(',');}
function csvModal(){openModal('一覧表で一括登録',`<p class="muted">1行に1品目。表計算アプリからのコピー（タブ区切り）もそのまま貼り付けできます。同じ名前は上書きします。月は「3-5/9」のように書きます。</p>
  <textarea class="inp" id="csvT" placeholder="${CSV_HEAD}">${CSV_HEAD}\nスナップエンドウ,野菜,10-11,,4-5,60,30,点まき,3,0,ネット,180,不織布,#6fae5a\nリーフレタス,野菜,3/9,4/10,5-6/11-12,20,20,すじまき,1,25,なし,0,不織布,#a5d66b</textarea>`,
  `<button class="btn" id="csvOut">登録済みを表示</button><button class="btn" data-close>やめる</button><button class="btn pri" id="csvIn">読み込む</button>`);
  $('#csvOut').onclick=()=>{$('#csvT').value=[CSV_HEAD,...S.plants.map(plantToCsv)].join('\n');};
  $('#csvIn').onclick=()=>{const lines=$('#csvT').value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);let add=0,upd=0,err=[];pushUndo();
    lines.forEach((l,i)=>{const f=l.split(/\t|,/).map(x=>x.trim().replace(/^"|"$/g,''));if(f[0]==='名前'||!f[0])return;
      const a=[f[0],CATS.includes(f[1])?f[1]:'野菜',f[2],f[3],f[4],f[5],f[6],f[7]==='すじまき'?'すじまき':'点まき',f[8],f[9],SUPPORTS.includes(f[10])?f[10]:'なし',f[11],PROTECTS.includes(f[12])?f[12]:'なし',/^#[0-9a-f]{6}$/i.test(f[13]||'')?f[13]:null];
      const np=mkPlant(a);if(!hasSeed(np)&&!hasSeedling(np)){err.push(`${i+1}行目 ${f[0]}`);}
      const ex=S.plants.find(p=>p.name===np.name);if(ex){const id=ex.id,col=a[13]?np.color:ex.color;Object.assign(ex,np,{id,color:col});upd++;}else{S.plants.push(np);add++;}});
    if(!add&&!upd){undoS.pop();return toast('読み込める行がありません');}
    closeModal();changed();toast(`追加${add}件・更新${upd}件${err.length?`（時期か間隔が未入力：${err.length}件）`:''}`);};}
function tableModal(){const body=()=>`<div class="scroll"><table><tr><th></th><th>名前</th><th>播種</th><th>苗</th><th class="n">条間/株間</th><th class="n">苗株間</th><th>支柱・資材</th><th></th></tr>
  ${S.plants.map(p=>`<tr><td><input type="checkbox" class="tk" value="${p.id}" style="width:22px;height:22px"></td><td><span class="dot" style="display:inline-block;background:${p.color};vertical-align:-2px"></span> ${esc(p.name)}<br><span class="muted">${p.cat}</span></td><td>${fmtMonths(p.seedM)}</td><td>${fmtMonths(p.plantM)}</td>
  <td class="n">${hasSeed(p)?`${p.rowSp}/${p.seedSp}<br><span class="muted">${p.sow}</span>`:''}</td><td class="n">${hasSeedling(p)?p.seedlingSp:''}</td><td>${p.support!=='なし'?`${p.support}${p.supLen}`:''} ${p.protect!=='なし'?p.protect:''}</td><td><button class="btn sm" data-ed="${p.id}">編集</button></td></tr>`).join('')}</table></div>`;
  openModal(`登録一覧（${S.plants.length}件）`,body(),`<button class="btn dan" id="tDel">チェックしたものを削除</button><button class="btn" data-close>閉じる</button>`);
  $('#mb').onclick=e=>{const b=e.target.closest('[data-ed]');if(b){plantEditor(plantById(b.dataset.ed));}};
  $('#tDel').onclick=()=>{const ids=$$('#mb .tk:checked').map(x=>x.value);if(!ids.length)return toast('削除するものにチェックしてください');closeModal();
    askConfirm(`${ids.length}件の植物を削除しますか？配置済みのものも消えます。`,()=>{pushUndo();S.plants=S.plants.filter(p=>!ids.includes(p.id));S.plans.forEach(pl=>pl.items=pl.items.filter(i=>!ids.includes(i.p)));if(ids.includes(active.pid))active={pid:null,m:null};changed();});};}

/* ============ 書き出し ============ */
function exportData(){openModal('データを書き出す',`<p class="muted">下の文字列をコピーしてメモアプリなどに保存してください。「データを読み込む」に貼り付けると復元できます。</p><textarea class="inp" id="exT" readonly>${esc(JSON.stringify(S))}</textarea>`,
  `<button class="btn" data-close>閉じる</button><button class="btn" id="exF">ファイルに保存</button><button class="btn pri" id="exC">コピーする</button>`);
  $('#exF').onclick=()=>{const d=new Date(),nm=`potager-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;const j=JSON.stringify(S);
    if(NATIVE)return nativePost({type:'shareText',name:nm,data:j});
    try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([j],{type:'application/json'}));a.download=nm;document.body.appendChild(a);a.click();a.remove();}catch(e){toast('この環境ではコピーを使ってください');}};
  $('#exC').onclick=async()=>{const t=$('#exT');t.removeAttribute('readonly');t.select();t.setSelectionRange(0,t.value.length);let ok=false;try{await navigator.clipboard.writeText(t.value);ok=true;}catch(_){try{ok=document.execCommand('copy');}catch(__){}}t.setAttribute('readonly','');toast(ok?'コピーしました':'文字列を長押しして全選択→コピーしてください');};}
function importData(){openModal('データを読み込む',`<p class="muted">書き出した文字列を貼り付けてください。現在のデータは置き換わります（元に戻すで復元可）。</p><div class="fld"><label>ファイルから読み込む</label><input class="inp" type="file" id="imF" accept=".json,application/json,text/plain"></div><div class="fld"><label>または文字列を貼り付け</label><textarea class="inp" id="imT"></textarea></div>`,
  `<button class="btn" data-close>やめる</button><button class="btn pri" id="imGo">読み込む</button>`);
  $('#imF').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#imT').value=r.result;toast('ファイルを読み込みました。「読み込む」で反映します');};r.readAsText(f);};
  $('#imGo').onclick=()=>{try{const o=JSON.parse($('#imT').value);if(!Array.isArray(o.beds)||!Array.isArray(o.plants)||!Array.isArray(o.plans))throw 0;pushUndo();S.beds=o.beds;S.plants=o.plants;S.plans=o.plans;S.activePlan=o.activePlan||0;S.settings={...DEF,...o.settings};sel=null;closeModal();applyTheme();changed();fitView();toast('読み込みました');}catch(e){toast('データの形式が正しくありません');}};}
function exportImage(){const pts=S.beds.flatMap(b=>b.pts);if(!pts.length)return toast('花壇がありません');const bb=bbox(pts);const s=clamp(Math.min(1600/bb.w,1600/bb.h),0.5,8);
  const t=tally(items());const legendH=40+Math.ceil(t.length/3)*22;const W=Math.round(bb.w*s+160),H=Math.round(bb.h*s+170+legendH);
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');const v={s,ox:80-bb.minX*s,oy:90-bb.minY*s};const keepSel=sel;sel=null;
  drawScene(x,W,H-legendH,v,{export:true});sel=keepSel;
  x.fillStyle=colors.panel;x.fillRect(0,H-legendH,W,legendH);x.fillStyle=colors.ink;x.font='700 18px -apple-system,sans-serif';x.textAlign='left';x.textBaseline='top';x.fillText(`${S.settings.projectName}　${plan().name}`,16,14);
  x.font='13px -apple-system,sans-serif';t.forEach((q,i)=>{const cx=16+(i%3)*((W-32)/3),cy=H-legendH+14+Math.floor(i/3)*22;x.fillStyle=q.p.color;x.beginPath();x.arc(cx+6,cy+8,6,0,Math.PI*2);x.fill();x.fillStyle=colors.ink;
    x.fillText(`${q.p.name} ${q.sd?q.sd+'株':''}${q.rows?` ${q.rows}条(${q.rowPlants}株)`:''}`,cx+18,cy+1);});
  let url;try{url=c.toDataURL('image/png');}catch(e){return toast('画像を作れませんでした');}
  if(NATIVE){openModal('図面の画像',`<img src="${url}" alt="作図の画像" style="width:100%;border:1px solid var(--line);border-radius:10px;-webkit-touch-callout:none">`,`<button class="btn" data-close>閉じる</button><button class="btn pri" id="imgS">共有・ファイルに保存</button>`);
    $('#imgS').onclick=()=>nativePost({type:'shareImage',name:`${S.settings.projectName}-${plan().name}.png`.replace(/[\\/:*?"<>|]/g,'_'),data:url});render();return;}
  openModal('図面の画像',`<p class="muted">画像を長押しして「"写真"に保存」や共有ができます。</p><img src="${url}" alt="作図の画像" style="width:100%;border:1px solid var(--line);border-radius:10px;-webkit-touch-callout:default;user-select:auto">`);render();}

/* ============ 起動 ============ */
function applyTheme(){const t=S.settings.theme;if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t);readColors();render();}
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{readColors();render();});}catch(e){}
new ResizeObserver(resize).observe(cwrap);
applyTheme();computeConflicts();setTool('select');refreshPanel();
requestAnimationFrame(()=>{resize();fitView();});

/* ============ オフライン（PWA） ============ */
if('serviceWorker' in navigator&&location.protocol==='https:'){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});
  let hadCtrl=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadCtrl)toast('新しい版を取り込みました。アプリを開き直すと反映されます');hadCtrl=true;});
}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
</script>
</body>
</html>
