<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ポタジェ">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#3d7a4a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>ポタジェ作図ノート</title>
<style>
:root{
  --paper:#eef2ea; --panel:#fbfcf8; --ink:#1f3a2c; --sub:#5f7166; --line:#d5ddd2;
  --leaf:#3d7a4a; --leafSoft:#dcebd9; --pen:#2f5fb3; --danger:#c23b3b; --warn:#b7791f;
  --grid:#d3dde6; --gridMajor:#a9bccd; --soil:#d8c29c; --soilEdge:#7d6040; --chip:#e6ece2;
  --shadow:0 6px 24px rgba(31,58,44,.16);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#18201b; --panel:#1f2822; --ink:#e3ece4; --sub:#9fb0a4; --line:#344239;
    --leaf:#7cc28a; --leafSoft:#2b3d2f; --pen:#7ea6ec; --danger:#ef7070; --warn:#e0a84a;
    --grid:#26312b; --gridMajor:#3b4b42; --soil:#4a3d2b; --soilEdge:#b89468; --chip:#2a352e;
    --shadow:0 6px 24px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --paper:#18201b; --panel:#1f2822; --ink:#e3ece4; --sub:#9fb0a4; --line:#344239;
  --leaf:#7cc28a; --leafSoft:#2b3d2f; --pen:#7ea6ec; --danger:#ef7070; --warn:#e0a84a;
  --grid:#26312b; --gridMajor:#3b4b42; --soil:#4a3d2b; --soilEdge:#b89468; --chip:#2a352e;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--panel);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;font-size:15px;line-height:1.5;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}
#app{height:100%;display:flex;flex-direction:column}
button{font:inherit;color:inherit}
.tb{display:flex;gap:4px;align-items:center;padding:6px 8px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;flex:none;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tb::-webkit-scrollbar{display:none}
.brand{font-weight:700;font-size:15px;padding:0 8px 0 4px;white-space:nowrap;letter-spacing:.02em}
.sep{width:1px;height:34px;background:var(--line);margin:0 4px;flex:none}
.tbtn{min-width:52px;height:52px;border:0;border-radius:12px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;gap:1px;padding:0 6px;touch-action:manipulation;cursor:pointer;flex:none;white-space:nowrap}
.tbtn .ic{font-size:20px;line-height:1.1}
.tbtn.on{background:var(--leaf);color:var(--panel)}
.tbtn:active{opacity:.7}
.tbtn:focus-visible,.btn:focus-visible,.inp:focus-visible,select:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
.tsel{height:40px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font:inherit;padding:0 8px;flex:none}
main{flex:1;display:flex;min-height:0;position:relative}
#cwrap{flex:1;position:relative;min-width:0;overflow:hidden;background:var(--paper)}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 12px;font-size:13px;box-shadow:var(--shadow);display:flex;gap:8px;align-items:center;max-width:calc(100% - 24px);z-index:2}
#hint .txt{color:var(--sub)}
#chip{position:absolute;right:12px;bottom:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 12px;font-size:13px;box-shadow:var(--shadow);display:flex;gap:8px;align-items:center;z-index:2;max-width:70%}
.dot{width:14px;height:14px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.25)}
.ln{width:18px;height:5px;border-radius:3px;flex:none}
#panel{width:370px;flex:none;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#panel.hidden{display:none}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;height:46px;border:0;background:transparent;font-size:13px;color:var(--sub);border-bottom:3px solid transparent;touch-action:manipulation}
.tabs button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--leaf)}
#pbody{flex:1;overflow-y:auto;padding:14px 14px 40px;-webkit-overflow-scrolling:touch}
@media (max-width:760px){
  #panel{position:absolute;left:0;right:0;bottom:0;height:56%;width:auto;border-left:0;border-top:1px solid var(--line);z-index:5;box-shadow:var(--shadow);border-radius:16px 16px 0 0}
}
h3{font-size:15px;margin:18px 0 8px}
h3:first-child{margin-top:0}
.muted{color:var(--sub);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.btn{min-height:44px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:0 14px;touch-action:manipulation;cursor:pointer;font-size:14px}
.btn.pri{background:var(--leaf);color:var(--panel);border-color:var(--leaf);font-weight:600}
.btn.dan{color:var(--danger);border-color:var(--danger)}
.btn.sm{min-height:36px;padding:0 10px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.35}
.btn.full{width:100%}
.inp,select.inp,textarea.inp{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font:inherit;padding:8px 10px;-webkit-user-select:text;user-select:text}
textarea.inp{min-height:180px;font-size:13px;line-height:1.5;font-family:ui-monospace,Menlo,monospace}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.fld label{font-size:12px;color:var(--sub)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.pl{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.pl.act{background:var(--leafSoft);border-radius:10px}
.pl .nm{flex:1;min-width:0}
.pl .nm b{display:block;font-size:15px}
.pl .nm span{font-size:12px;color:var(--sub)}
.pb{min-width:54px;height:40px;border-radius:10px;border:1px solid var(--leaf);background:transparent;color:var(--leaf);font-size:13px;font-weight:600;touch-action:manipulation}
.pb.on{background:var(--leaf);color:var(--panel)}
.pb:disabled{border-color:var(--line);color:var(--sub);opacity:.5}
.pb.off{border-style:dashed}
.ed{width:40px;height:40px;border-radius:10px;border:0;background:var(--chip)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--sub);font-weight:600;font-size:12px}
td.n,th.n{text-align:right;white-space:nowrap}
.scroll{overflow-x:auto}
.box{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
.warn{color:var(--warn)}
.bad{color:var(--danger)}
.good{color:var(--leaf)}
details{border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:8px 0}
summary{font-weight:600;cursor:pointer;min-height:32px;display:flex;align-items:center}
.months{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.months button{height:38px;border-radius:8px;border:1px solid var(--line);background:transparent;font-size:13px;touch-action:manipulation}
.months button.on{background:var(--leaf);color:var(--panel);border-color:var(--leaf)}
.cal td{padding:2px;text-align:center;font-size:11px;border:1px solid var(--line)}
.cal td.nm{text-align:left;white-space:nowrap;padding:2px 6px}
.cal .s{background:#f1d27a;color:#4a3a00}.cal .p{background:#9fd39b;color:#123d18}.cal .h{background:#e9a07c;color:#4a1a05}
.cal th{text-align:center;font-size:11px;padding:2px}
.cal th.cur{color:var(--pen)}
.sw{display:flex;align-items:center;gap:6px;font-size:13px;min-height:36px}
.sw input{width:22px;height:22px;accent-color:var(--leaf)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#modal{position:fixed;inset:0;background:rgba(10,20,14,.45);display:none;align-items:center;justify-content:center;z-index:40;padding:16px}
#modal.show{display:flex}
#modal .mc{background:var(--panel);border-radius:18px;max-width:640px;width:100%;max-height:90%;display:flex;flex-direction:column;box-shadow:var(--shadow)}
#modal .mh{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700}
#modal .mb{padding:14px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch}
#modal .mf{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px}
.legend span{display:flex;gap:6px;align-items:center}
input,textarea{-webkit-user-select:text;user-select:text}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
#app{position:relative}
.screen{position:absolute;inset:0;display:none;flex-direction:column;min-height:0}
.screen.show{display:flex}
.papergrid{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px),linear-gradient(var(--gridMajor) 1px,transparent 1px),linear-gradient(90deg,var(--gridMajor) 1px,transparent 1px);background-size:24px 24px,24px 24px,120px 120px,120px 120px}
#scr-home{align-items:center;justify-content:center;overflow-y:auto;padding:24px 16px}
.hwrap{width:min(460px,100%);display:flex;flex-direction:column;gap:14px}
.logo{text-align:center;margin-bottom:10px}
.logo .mk{width:88px;height:88px;border-radius:22px;background:var(--soil);border:3px solid var(--soilEdge);margin:0 auto 12px;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:14px;box-shadow:var(--shadow)}
.logo .mk i{border-radius:50%;display:block}
.logo h1{font-size:26px;margin:0;letter-spacing:.06em}
.logo p{margin:4px 0 0;color:var(--sub);font-size:14px}
.big{display:flex;gap:16px;align-items:center;width:100%;min-height:84px;padding:14px 20px;border-radius:18px;border:1px solid var(--line);background:var(--panel);text-align:left;font-size:19px;font-weight:700;box-shadow:var(--shadow);cursor:pointer;touch-action:manipulation}
.big .bi{font-size:28px;width:44px;text-align:center;flex:none}
.big small{display:block;font-weight:400;font-size:13px;color:var(--sub);margin-top:2px}
.big.pri{background:var(--leaf);color:var(--panel);border-color:var(--leaf)}
.big.pri small{color:var(--panel);opacity:.85}
.big:active{transform:scale(.99)}
.hsub{display:flex;gap:8px;justify-content:center;margin-top:8px}
.ph{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
.ph h2{font-size:17px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pgb{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pgi{max-width:980px;margin:0 auto;padding:16px 16px 60px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{border:1px solid var(--line);border-radius:16px;background:var(--panel);overflow:hidden;display:flex;flex-direction:column;position:relative;box-shadow:0 2px 8px rgba(31,58,44,.06)}
.card img,.card .th{width:100%;aspect-ratio:3/2;object-fit:contain;background:var(--paper);display:block}
.card .cb{padding:10px 12px;flex:1}
.card .ca{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:0 10px 10px}
.card .ca .btn{padding:0 4px;font-size:12px}
.bt{cursor:pointer;text-align:left;font:inherit;color:inherit;padding:0}
.bt .btw{border:0;background:transparent;padding:0;text-align:left;width:100%;cursor:pointer;touch-action:manipulation}
.bt.new{border:2px dashed var(--leaf);align-items:center;justify-content:center;min-height:210px;color:var(--leaf);font-weight:700;font-size:17px;background:var(--leafSoft)}
.bt.new .pl2{font-size:40px;line-height:1}
.x{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-size:14px;touch-action:manipulation}
.ttl{border:0;background:transparent;font-weight:700;font-size:15px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-height:44px;padding:0 6px;flex:none;touch-action:manipulation}
.tbtn.go{background:var(--leaf);color:var(--panel);min-width:84px;font-size:13px;font-weight:700}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.seg button{min-height:38px;padding:0 14px;border-radius:19px;border:1px solid var(--line);background:var(--panel);font-size:13px;touch-action:manipulation}
.seg button.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.crow{display:flex;gap:12px;align-items:center;padding:12px 6px;border-bottom:1px solid var(--line);cursor:pointer}
.crow .nm{flex:1;min-width:0}
.crow .nm b{font-size:16px}
.crow .nm div{font-size:12.5px;color:var(--sub)}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:9px;background:var(--chip);margin-right:4px;color:var(--ink)}
.steps{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--sub);margin-bottom:12px}
.steps b{color:var(--leaf)}
fieldset{border:0;margin:0;padding:0;min-width:0}
fieldset:disabled .btn,fieldset:disabled .inp{opacity:.6}
.banner{background:var(--leafSoft);color:var(--ink);font-size:13px;padding:8px 12px;border-radius:10px;margin-bottom:10px}
</style>
</head>
<body>
<div id="app">
  <section class="screen papergrid" id="scr-home"><div class="hwrap" id="homeBody"></div></section>
  <section class="screen" id="scr-page">
    <div class="ph"><button class="btn sm" id="pgBack">← 戻る</button><h2 id="pgTitle"></h2><div class="row" id="pgAct"></div></div>
    <div class="pgb" id="pgBody"></div>
  </section>
  <section class="screen" id="scr-work">
    <div class="tb" id="tb"></div>
    <main>

        <div id="chip"></div>

      <aside id="panel">
        <div class="tabs" id="tabs"></div>
        <div id="pbody"></div>
      </aside>
    </main>
  </section>
</div>
<div id="toast"></div>
<div id="modal"><div class="mc"><div class="mh"><span id="mt"></span><button class="btn sm" data-close>閉じる</button></div><div class="mb" id="mb"></div><div class="mf" id="mf"></div></div></div>

function parseMonths(str){
  const out=new Set();
  String(str||'').split(/[\/,・、\s]+/).forEach(t=>{
    t=t.replace(/月/g,'').trim(); if(!t) return;
    const m=t.split(/[-~〜–]/).map(Number);
    if(m.length===2&&m[0]>=1&&m[0]<=12&&m[1]>=1&&m[1]<=12){let a=m[0];for(let i=0;i<12;i++){out.add(a);if(a===m[1])break;a=a%12+1;}}
    else if(m[0]>=1&&m[0]<=12) out.add(m[0]);
  });
  return [...out].sort((a,b)=>a-b);
}
function fmtMonths(arr){
  if(!arr||!arr.length) return '';
  const a=[...arr].sort((x,y)=>x-y), r=[]; let s=a[0],p=a[0];
  for(let i=1;i<=a.length;i++){ if(a[i]===p+1){p=a[i];continue;} r.push(s===p?`${s}`:`${s}-${p}`); s=p=a[i]; }
  return r.join('・')+'月';
}

function rectPts(x0,y0,x1,y1){const a=Math.min(x0,x1),b=Math.min(y0,y1),c=Math.max(x0,x1),d=Math.max(y0,y1);return [[a,b],[c,b],[c,d],[a,d]];}
function circPts(cx,cy,r){const n=72,o=[];for(let i=0;i<n;i++){const t=i/n*Math.PI*2;o.push([cx+r*Math.cos(t),cy+r*Math.sin(t)]);}return o;}
function bbox(pts){let a=Infinity,b=Infinity,c=-Infinity,d=-Infinity;for(const p of pts){a=Math.min(a,p[0]);b=Math.min(b,p[1]);c=Math.max(c,p[0]);d=Math.max(d,p[1]);}return {minX:a,minY:b,maxX:c,maxY:d,w:c-a,h:d-b};}
function sArea(P){let s=0;for(let i=0;i<P.length;i++){const a=P[i],b=P[(i+1)%P.length];s+=a[0]*b[1]-b[0]*a[1];}return s/2;}
function bedArea(b){return b.shape==='circle'?Math.PI*b.c.r*b.c.r:Math.abs(sArea(b.pts));}
function bedPerim(b){if(b.shape==='circle')return 2*Math.PI*b.c.r;let s=0;for(let i=0;i<b.pts.length;i++){const a=b.pts[i],c=b.pts[(i+1)%b.pts.length];s+=Math.hypot(c[0]-a[0],c[1]-a[1]);}return s;}
function centroid(P){let A=0,cx=0,cy=0;for(let i=0;i<P.length;i++){const a=P[i],b=P[(i+1)%P.length],f=a[0]*b[1]-b[0]*a[1];A+=f;cx+=(a[0]+b[0])*f;cy+=(a[1]+b[1])*f;}if(Math.abs(A)<1e-9){const bb=bbox(P);return [(bb.minX+bb.maxX)/2,(bb.minY+bb.maxY)/2];}return [cx/(3*A),cy/(3*A)];}
function pip(x,y,P){let c=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const a=P[i],b=P[j];if(((a[1]>y)!==(b[1]>y))&&(x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0]))c=!c;}return c;}
function dPS(px,py,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],L=dx*dx+dy*dy;let t=L?((px-a[0])*dx+(py-a[1])*dy)/L:0;t=clamp(t,0,1);return Math.hypot(px-(a[0]+t*dx),py-(a[1]+t*dy));}
function orient(a,b,c){const v=(b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0]);return Math.abs(v)<1e-9?0:(v>0?1:-1);}
function onSeg(a,b,c){return Math.min(a[0],b[0])-1e-9<=c[0]&&c[0]<=Math.max(a[0],b[0])+1e-9&&Math.min(a[1],b[1])-1e-9<=c[1]&&c[1]<=Math.max(a[1],b[1])+1e-9;}
function segX(a,b,c,d){const o1=orient(a,b,c),o2=orient(a,b,d),o3=orient(c,d,a),o4=orient(c,d,b);if(o1!==o2&&o3!==o4)return true;if(o1===0&&onSeg(a,b,c))return true;if(o2===0&&onSeg(a,b,d))return true;if(o3===0&&onSeg(c,d,a))return true;if(o4===0&&onSeg(c,d,b))return true;return false;}
function dSS(a,b,c,d){if(segX(a,b,c,d))return 0;return Math.min(dPS(a[0],a[1],c,d),dPS(b[0],b[1],c,d),dPS(c[0],c[1],a,b),dPS(d[0],d[1],a,b));}
function bedOfPoint(x,y){for(let i=S.beds.length-1;i>=0;i--)if(pip(x,y,S.beds[i].pts))return S.beds[i];return null;}

function shapeOf(it){const p=plantById(it.p);if(!p)return null;

function obstacles(exId){return items().filter(i=>i.id!==exId).map(shapeOf).filter(Boolean);}

const rectEdges=o=>{const a=[o.x1,o.y1],b=[o.x2,o.y1],c=[o.x2,o.y2],d=[o.x1,o.y2];return [[a,b],[b,c],[c,d],[d,a]];};
const inRect=(x,y,o)=>x>o.x1&&x<o.x2&&y>o.y1&&y<o.y2;
function coreDist(A,B){

    if(inRect(A.x,A.y,B))return 0;return Math.min(...rectEdges(B).map(e=>dPS(A.x,A.y,e[0],e[1])));}

  const groups=new Map();

    if(action&&action.kind==='poly')c.lineTo(X(action.p[0]),Y(action.p[1]));c.stroke();c.setLineDash([]);
    polyPts.forEach((p,i)=>{c.beginPath();c.arc(X(p[0]),Y(p[1]),i?5:9,0,Math.PI*2);c.fillStyle=i?C.leaf:C.panel;c.fill();c.strokeStyle=C.leaf;c.stroke();});
    for(let i=1;i<polyPts.length;i++){const a=polyPts[i-1],b=polyPts[i];pill(c,`${fmt(Math.hypot(b[0]-a[0],b[1]-a[1]))}cm`,X((a[0]+b[0])/2),Y((a[1]+b[1])/2)-12,{color:C.pen,size:11});}}
  if(!action){if(measure)drawMeasure(c,v,measure);return;}
  const A=action;
  if(A.kind==='poly'){pill(c,`(${fmt(A.p[0])}, ${fmt(A.p[1])})`,X(A.p[0]),Y(A.p[1])-22,{color:C.pen,size:11});}
  if(A.kind==='rect'){const P=rectPts(A.a[0],A.a[1],A.b[0],A.b[1]);const bb=bbox(P);c.fillStyle=hexA('#d8c29c',.5);c.strokeStyle=C.leaf;c.lineWidth=2;c.setLineDash([6,4]);c.beginPath();c.rect(X(bb.minX),Y(bb.minY),bb.w*s,bb.h*s);c.fill();c.stroke();c.setLineDash([]);
    pill(c,`${fmt(bb.w)} × ${fmt(bb.h)}cm`,X(bb.minX+bb.w/2),Y(bb.minY)-14,{color:C.pen,bold:true});}
  if(A.kind==='circle'){const r=Math.hypot(A.b[0]-A.a[0],A.b[1]-A.a[1]);c.beginPath();c.arc(X(A.a[0]),Y(A.a[1]),r*s,0,Math.PI*2);c.fillStyle=hexA('#d8c29c',.5);c.fill();c.strokeStyle=C.leaf;c.lineWidth=2;c.setLineDash([6,4]);c.stroke();c.setLineDash([]);
    pill(c,`直径 ${fmt(r*2)}cm`,X(A.a[0]),Y(A.a[1]),{color:C.pen,bold:true});}
  const dimsFrom=q=>{const b=bedOfPoint(q[0],q[1]);if(b){const bb=bbox(b.pts);dimLine(c,v,[bb.minX,q[1]],q,`左から${fmt(q[0]-bb.minX)}`,C.pen);dimLine(c,v,[q[0],bb.minY],q,`上から${fmt(q[1]-bb.minY)}`,C.pen);}};
  if(A.kind==='seed'){const p=plantById(active.pid);if(p){const r=p.seedlingSp/2;c.beginPath();c.arc(X(A.p[0]),Y(A.p[1]),r*s,0,Math.PI*2);c.fillStyle=hexA(A.ok?p.color:'#c23b3b',.3);c.fill();c.strokeStyle=A.ok?p.color:C.danger;c.lineWidth=2;c.setLineDash([5,4]);c.stroke();c.setLineDash([]);
    dimsFrom(A.p);if(!A.ok)pill(c,A.msg,X(A.p[0]),Y(A.p[1])-r*s-16,{color:C.danger,size:12,bold:true});}}
  if(A.kind==='area'){const p=plantById(active.pid);if(p){const x1=Math.min(A.a[0],A.b[0]),y1=Math.min(A.a[1],A.b[1]),w=Math.abs(A.b[0]-A.a[0]),h=Math.abs(A.b[1]-A.a[1]);
    c.fillStyle=hexA(A.ok?p.color:'#c23b3b',.28);c.fillRect(X(x1),Y(y1),w*s,h*s);c.strokeStyle=A.ok?p.color:C.danger;c.lineWidth=2;c.setLineDash([5,4]);c.strokeRect(X(x1),Y(y1),w*s,h*s);c.setLineDash([]);
    const m2=w*h/10000;pill(c,A.ok?`${fmt(w)}×${fmt(h)}cm・${fmt(m2)}㎡・種${Math.ceil(m2*p.perPoint)}粒`:(A.msg||''),X(x1+w/2),Y(y1)-16,{color:A.ok?C.pen:C.danger,bold:true});dimsFrom([x1,y1]);}}

    const e=A.fit&&A.fit.ok?A.fit.b:A.b;
    if(A.fit&&A.fit.trim){c.beginPath();c.moveTo(X(e[0]),Y(e[1]));c.lineTo(X(A.b[0]),Y(A.b[1]));c.strokeStyle=hexA('#c23b3b',.25);c.lineWidth=w*2;c.stroke();}
    c.beginPath();c.moveTo(X(A.a[0]),Y(A.a[1]));c.lineTo(X(e[0]),Y(e[1]));c.strokeStyle=hexA(A.fit&&A.fit.ok?p.color:'#c23b3b',.3);c.lineWidth=w*2;c.stroke();
    c.lineWidth=2;c.strokeStyle=A.fit&&A.fit.ok?p.color:C.danger;c.stroke();c.lineCap='butt';
    const L=Math.hypot(e[0]-A.a[0],e[1]-A.a[1]);
    if(A.fit&&A.fit.ok){const n=Math.floor(L/p.seedSp+1e-6)+1;pill(c,`${fmt(L)}cm・${n}株${A.fit.trim?'（間隔確保のため短縮）':''}`,X(e[0]),Y(e[1])-w-16,{color:C.pen,bold:true});}
    else pill(c,A.fit?A.fit.msg||'置けません':'',X(A.a[0]),Y(A.a[1])-w-16,{color:C.danger,bold:true});
    dimsFrom(A.a);}}
  if(A.kind==='moveItem'&&!A.valid&&A.msg){const it=A.it;const q=it.k==='s'?[it.x,it.y]:[it.x1,it.y1];pill(c,A.msg,X(q[0]),Y(q[1])-28,{color:C.danger,bold:true});}

  if(A.kind==='lasso'){const x1=Math.min(A.a[0],A.b[0]),y1=Math.min(A.a[1],A.b[1]),w=Math.abs(A.b[0]-A.a[0]),h=Math.abs(A.b[1]-A.a[1]);c.fillStyle=hexA('#2f5fb3',.08);c.fillRect(X(x1),Y(y1),w*s,h*s);c.strokeStyle=C.pen;c.lineWidth=1.5;c.setLineDash([6,4]);c.strokeRect(X(x1),Y(y1),w*s,h*s);c.setLineDash([]);}
  if(A.kind==='rowEnd'){const it=A.it,p=plantById(it.p);const L=rowLen(it);const q=A.end===1?[it.x1,it.y1]:[it.x2,it.y2];
    pill(c,A.valid?`${fmt(L)}cm・${Math.floor(L/p.seedSp+1e-6)+1}株`:(A.msg||''),X(q[0]),Y(q[1])-26,{color:A.valid?C.pen:C.danger,bold:true});}
  if(A.kind==='areaCorner'){const it=A.it,p=plantById(it.p);const a=areaStats(it,p);pill(c,A.valid?`${fmt(a.w)}×${fmt(a.h)}cm・${fmt(a.m2)}㎡`:(A.msg||''),X((it.x1+it.x2)/2),Y(Math.min(it.y1,it.y2))-16,{color:A.valid?C.pen:C.danger,bold:true});}
  if(A.kind==='moveGroup'&&!A.valid&&A.msg){const it=itemById([...msel][0]);if(it){const q=it.k==='s'?[it.x,it.y]:[it.x1,it.y1];pill(c,A.msg,X(q[0]),Y(q[1])-28,{color:C.danger,bold:true});}}
}
function itemHandles(it){if(it.k==='r')return [{x:it.x1,y:it.y1,end:1},{x:it.x2,y:it.y2,end:2}];
  if(it.k==='a'){const x1=Math.min(it.x1,it.x2),y1=Math.min(it.y1,it.y2),x2=Math.max(it.x1,it.x2),y2=Math.max(it.y1,it.y2);return [{x:x1,y:y1,c:[x2,y2]},{x:x2,y:y1,c:[x1,y2]},{x:x2,y:y2,c:[x1,y1]},{x:x1,y:y2,c:[x2,y1]}];}return [];}
function hitItemHandle(it,sp){let best=null,bd=24;for(const h of itemHandles(it)){const d=Math.hypot(h.x*V.s+V.ox-sp.x,h.y*V.s+V.oy-sp.y);if(d<bd){bd=d;best=h;}}return best;}
function groupObs(){return items().filter(i=>!msel.has(i.id)).map(shapeOf).filter(Boolean);}
function groupCheck(){const obs=groupObs();for(const id of msel){const it=itemById(id);if(!it)continue;const r=checkItem(it,obs);if(!r.ok){const p=plantById(it.p);return {ok:false,msg:`${p?p.name+'：':''}${r.msg}`};}}return {ok:true};}
function itemsInBox(x1,y1,x2,y2){return items().filter(it=>{const p=plantById(it.p);if(!p)return false;const b=itemBox(it,p);return b.maxX>=x1&&b.minX<=x2&&b.maxY>=y1&&b.minY<=y2;});}
function moveItemBy(it,o,dx,dy){if(it.k==='s'){it.x=o.x+dx;it.y=o.y+dy;}else{it.x1=o.x1+dx;it.y1=o.y1+dy;it.x2=o.x2+dx;it.y2=o.y2+dy;}}
const COMPASS={dx:44,y:86};
function drawCompass(c,W,opt){const x=W-COMPASS.dx,y=opt.export?44:COMPASS.y;const n=northOf();
  c.save();c.translate(x,y);c.fillStyle=colors.panel;c.globalAlpha=.9;c.beginPath();c.arc(0,0,30,0,Math.PI*2);c.fill();c.globalAlpha=1;c.strokeStyle=colors.line;c.lineWidth=1;c.stroke();
  c.rotate(n*Math.PI/180);
  c.beginPath();c.moveTo(0,-20);c.lineTo(6,0);c.lineTo(0,-3);c.lineTo(-6,0);c.closePath();c.fillStyle=colors.danger;c.fill();
  c.beginPath();c.moveTo(0,20);c.lineTo(6,0);c.lineTo(0,3);c.lineTo(-6,0);c.closePath();c.fillStyle=colors.sub;c.fill();
  c.font='700 10px -apple-system,sans-serif';c.textAlign='center';c.textBaseline='middle';
  [['北',0,-25,colors.danger],['東',25,0,colors.ink],['南',0,25,colors.ink],['西',-25,0,colors.ink]].forEach(([t,tx,ty,col])=>{c.save();c.translate(tx,ty);c.rotate(-n*Math.PI/180);c.fillStyle=col;c.fillText(t,0,0);c.restore();});
  c.restore();}
function hitItem(w){const tol=14/V.s;const its=items();for(let i=its.length-1;i>=0;i--){const it=its[i],p=plantById(it.p);if(!p)continue;
  if(it.k==='s'){if(Math.hypot(w.x-it.x,w.y-it.y)<=Math.max(p.seedlingSp/2,tol))return it;}
  else if(it.k==='a'){if(w.x>=Math.min(it.x1,it.x2)-tol/2&&w.x<=Math.max(it.x1,it.x2)+tol/2&&w.y>=Math.min(it.y1,it.y2)-tol/2&&w.y<=Math.max(it.y1,it.y2)+tol/2)return it;}
  else if(dPS(w.x,w.y,[it.x1,it.y1],[it.x2,it.y2])<=Math.max(p.rowSp/2,tol))return it;}return null;}

function drawSeedling(c,v,it,p,bad,isSel){
  const s=v.s,x=it.x*s+v.ox,y=it.y*s+v.oy,r=p.seedlingSp/2*s;
  c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fillStyle=hexA(p.color,.28);c.fill();
  c.lineWidth=isSel?3:1.5;c.strokeStyle=bad?colors.danger:isSel?colors.pen:hexA(p.color,.95);if(bad)c.setLineDash([5,4]);c.stroke();c.setLineDash([]);
  c.beginPath();c.arc(x,y,Math.max(2.5,Math.min(r*.18,6)),0,Math.PI*2);c.fillStyle=p.color;c.fill();
  if(S.settings.showLabels&&!noLabels&&r>=18){c.font=`${r>=34?12:10}px -apple-system,sans-serif`;c.fillStyle=colors.ink;c.textAlign='center';c.textBaseline='top';c.fillText(p.name.slice(0,r>=34?8:4),x,y+Math.min(r*.25,10)+2);}
}
function drawRow(c,v,it,p,bad,isSel){
  const s=v.s,ax=it.x1*s+v.ox,ay=it.y1*s+v.oy,bx=it.x2*s+v.ox,by=it.y2*s+v.oy,w=p.rowSp/2*s;
  c.lineCap='round';c.beginPath();c.moveTo(ax,ay);c.lineTo(bx,by);c.strokeStyle=hexA(p.color,.22);c.lineWidth=w*2;c.stroke();
  if(bad||isSel){c.save();c.lineWidth=w*2+ (isSel?3:2);c.strokeStyle=bad?colors.danger:colors.pen;c.globalAlpha=.35;c.beginPath();c.moveTo(ax,ay);c.lineTo(bx,by);c.stroke();c.restore();
    c.beginPath();c.moveTo(ax,ay);c.lineTo(bx,by);c.strokeStyle=hexA(p.color,.22);c.lineWidth=w*2;c.stroke();}
  c.beginPath();c.moveTo(ax,ay);c.lineTo(bx,by);c.strokeStyle=p.color;c.lineWidth=p.sow==='すじまき'?3:1.5;c.stroke();c.lineCap='butt';
  const L=rowLen(it),n=Math.floor(L/p.seedSp+1e-6)+1,ux=(it.x2-it.x1)/(L||1),uy=(it.y2-it.y1)/(L||1);
  if(p.seedSp*s>=4){for(let i=0;i<n;i++){const px=(it.x1+ux*p.seedSp*i)*s+v.ox,py=(it.y1+uy*p.seedSp*i)*s+v.oy;
    if(p.sow==='点まき'){c.beginPath();c.arc(px,py,Math.max(2.5,Math.min(p.seedSp*s*.2,6)),0,Math.PI*2);c.fillStyle=p.color;c.fill();c.strokeStyle=colors.panel;c.lineWidth=1;c.stroke();}
    else{c.beginPath();c.moveTo(px-uy*6,py+ux*6);c.lineTo(px+uy*6,py-ux*6);c.strokeStyle=p.color;c.lineWidth=1.5;c.stroke();}}}
  if(S.settings.showLabels&&!noLabels&&L*s>60){const mx=(ax+bx)/2,my=(ay+by)/2;pill(c,`${p.name} ${fmt(L)}cm`,mx,my-Math.max(w,8)-2,{size:10,bgAlpha:.75});}
}
function dimLine(c,v,a,b,text,col){
  const s=v.s,ax=a[0]*s+v.ox,ay=a[1]*s+v.oy,bx=b[0]*s+v.ox,by=b[1]*s+v.oy;const L=Math.hypot(bx-ax,by-ay);if(L<2)return;
  c.strokeStyle=col;c.lineWidth=1.3;c.setLineDash([4,3]);c.beginPath();c.moveTo(ax,ay);c.lineTo(bx,by);c.stroke();c.setLineDash([]);
  const nx=-(by-ay)/L*5,ny=(bx-ax)/L*5;c.beginPath();c.moveTo(ax-nx,ay-ny);c.lineTo(ax+nx,ay+ny);c.moveTo(bx-nx,by-ny);c.lineTo(bx+nx,by+ny);c.stroke();
  pill(c,text,(ax+bx)/2,(ay+by)/2,{color:col,size:11,bold:true});
}
function drawMeasure(c,v,m){const L=Math.hypot(m.b[0]-m.a[0],m.b[1]-m.a[1]);if(L<0.5)return;dimLine(c,v,m.a,m.b,`${fmt(L)}cm`,colors.danger);
  const s=v.s;[m.a,m.b].forEach(q=>{c.beginPath();c.arc(q[0]*s+v.ox,q[1]*s+v.oy,4,0,Math.PI*2);c.fillStyle=colors.danger;c.fill();});}
function drawScale(c,W,H,s,opt){
  const opts=[5,10,20,50,100,200,500,1000];let L=opts.find(x=>x*s>=70)||1000;
  const x=14,y=H-(opt.export?24:18);const w=L*s;
  c.fillStyle=colors.panel;c.globalAlpha=.92;roundRect(c,x-8,y-34,Math.max(w,150)+16,44,8);c.fill();c.globalAlpha=1;
  c.fillStyle=colors.ink;c.fillRect(x,y-4,w/2,4);c.strokeStyle=colors.ink;c.lineWidth=1;c.strokeRect(x+.5,y-4+.5,w-1,4);
  c.font='600 12px -apple-system,sans-serif';c.textAlign='left';c.textBaseline='alphabetic';c.fillText(L>=100?`${L/100}m`:`${L}cm`,x+w+4>x+Math.max(w,150)-30?x:x+w+6,y-9);
  c.font='11px -apple-system,sans-serif';c.fillStyle=colors.sub;c.fillText(`1マス = ${S.settings.grid}cm　太線 = ${S.settings.grid<=10?50:100}cm`,x,y-20);
}
/* ============ ヒット判定 ============ */
function handles(b){
  if(b.shape==='circle')return [{x:b.c.x+b.c.r,y:b.c.y,i:0}];
  const h=b.pts.map((p,i)=>({x:p[0],y:p[1],i}));
  if(b.shape==='poly')b.pts.forEach((p,i)=>{const q=b.pts[(i+1)%b.pts.length];h.push({x:(p[0]+q[0])/2,y:(p[1]+q[1])/2,i,mid:true});});
  return h;
}
function hitHandle(b,sp){let best=null,bd=22;for(const h of handles(b)){const d=Math.hypot(h.x*V.s+V.ox-sp.x,h.y*V.s+V.oy-sp.y);if(d<bd){bd=d;best=h;}}return best;}
function hitBed(w){return bedOfPoint(w.x,w.y);}

/* ============ 入力 ============ */
const toW=p=>({x:(p.x-V.ox)/V.s,y:(p.y-V.oy)/V.s});
const snapV=v=>{const st=S.settings.snap;return st>0?Math.round(v/st)*st:Math.round(v*10)/10;};
const snapP=w=>[snapV(w.x),snapV(w.y)];
function evPos(e){const r=cv.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}
const ptrs=new Map();let pinch=null,action=null,afterPinch=false;
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();try{cv.setPointerCapture(e.pointerId);}catch(_){}
  ptrs.set(e.pointerId,evPos(e));
  if(ptrs.size===2){cancelAction();const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1,s:V.s,m:{x:(a.x+b.x)/2,y:(a.y+b.y)/2},ox:V.ox,oy:V.oy};afterPinch=true;return;}
  if(ptrs.size===1){afterPinch=false;startAction(evPos(e));}
});
cv.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,evPos(e));
  if(pinch&&ptrs.size>=2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y)||1;const m={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
    const ns=clamp(pinch.s*d/pinch.d,0.1,40);const wx=(pinch.m.x-pinch.ox)/pinch.s,wy=(pinch.m.y-pinch.oy)/pinch.s;V.s=ns;V.ox=m.x-wx*ns;V.oy=m.y-wy*ns;render();return;}
  if(action&&!afterPinch)moveAction(evPos(e));
});
function ptrEnd(e){if(!ptrs.has(e.pointerId))return;const p=evPos(e);ptrs.delete(e.pointerId);
  if(pinch){if(ptrs.size<2)pinch=null;return;}
  if(action&&!afterPinch)endAction(p,e.type==='pointercancel');}
cv.addEventListener('pointerup',ptrEnd);cv.addEventListener('pointercancel',ptrEnd);
cv.addEventListener('wheel',e=>{e.preventDefault();const p=evPos(e);const f=Math.exp(-e.deltaY*0.0015);const ns=clamp(V.s*f,0.1,40);const wx=(p.x-V.ox)/V.s,wy=(p.y-V.oy)/V.s;V.s=ns;V.ox=p.x-wx*ns;V.oy=p.y-wy*ns;render();},{passive:false});
['gesturestart','gesturechange'].forEach(t=>document.addEventListener(t,e=>e.preventDefault()));

function needPlant(m){const p=plantById(active.pid);if(!p||active.m!==m){toast(m==='s'?'植物タブで苗を置く植物の「苗」を選んでください':'植物タブで播種する植物の「播種」を選んでください');openPanel('plants');return null;}return p;}
const activeIsBroadcast=()=>{const p=plantById(active.pid);return !!(p&&active.m==='r'&&p.sow==='ばらまき');};
function bedMoveAction(base,b,w){const inBed=[];cur.plans.forEach(pl=>pl.items.forEach(i=>{if(itemBed(i)===b)inBed.push({i,o:{...i}});}));
  return {...base,kind:'moveBed',bed:b,pts0:b.pts.map(p=>[...p]),c0:b.c?{...b.c}:null,inBed,w0:w,snap:snapshot()};}
function groupAction(base,w,toggleOff){const origs=new Map();for(const id of msel){const it=itemById(id);if(it)origs.set(id,{...it});}
  return {...base,kind:'moveGroup',origs,w0:w,valid:true,snap:snapshot(),toggleOff,tapId:null};}
function areaCheck(a,b){const x1=Math.min(a[0],b[0]),y1=Math.min(a[1],b[1]),x2=Math.max(a[0],b[0]),y2=Math.max(a[1],b[1]);
  if(x2-x1<5||y2-y1<5)return {ok:false,msg:'5cm以上の範囲をドラッグしてください'};return checkShape({k:'a',x1,y1,x2,y2,r:0},obstacles());}
function startAction(sp){
  const w=toW(sp);const base={start:sp,moved:false};
  if(wmode!=='view'&&Math.hypot(sp.x-(CW-COMPASS.dx),sp.y-COMPASS.y)<30){action={...base,kind:'compass'};return;}
  if(wmode==='view'){const it=hitItem(w),b=it?null:hitBed(w);action={...base,kind:'pan',ox:V.ox,oy:V.oy,tapSel:it?{t:'item',id:it.id}:b?{t:'bed',id:b.id}:null};return;}
  switch(tool){
    case 'select':{
      if(wmode==='bed'){const sb=sel&&sel.t==='bed'&&bedById(sel.id);
        if(sb){const h=hitHandle(sb,sp);if(h){action={...base,kind:'vertex',bed:sb,h,snap:snapshot()};return;}}
        const b=hitBed(w);if(b){select({t:'bed',id:b.id});action=bedMoveAction(base,b,w);return;}
        action={...base,kind:'pan',ox:V.ox,oy:V.oy,tapSel:null};return;}
      if(sel&&sel.t==='item'){const si=itemById(sel.id);const h=si&&hitItemHandle(si,sp);

function endAction(sp,cancelled){

  const w=toW(sp);
  switch(A.kind){
    case 'compass':openNorth();break;
    case 'pan':if(!A.moved)select(A.tapSel||null);break;
    case 'moveItem':if(A.moved){if(!A.valid){askOverlap(A.msg,()=>{pushUndo(A.snap);changed();},()=>{restore(A.snap);changed();});}else{pushUndo(A.snap);changed();}}break;
    case 'moveGroup':if(A.moved){if(!A.valid){askOverlap(A.msg,()=>{pushUndo(A.snap);changed();},()=>{restore(A.snap);changed();});}else{pushUndo(A.snap);changed();}}
      else if(A.toggleOff){const it=hitItem(w);if(it){msel.delete(it.id);refreshPanel();}}break;
    case 'rowEnd':case 'areaCorner':if(A.dirty){if(!A.valid){if(/5cm/.test(A.msg||'')){restore(A.snap);toast(A.msg);changed();}else askOverlap(A.msg,()=>{pushUndo(A.snap);changed();},()=>{restore(A.snap);changed();});}else{pushUndo(A.snap);changed();}}break;
    case 'lasso':{if(!A.moved){if(msel.size){msel.clear();refreshPanel();}break;}const f=itemsInBox(Math.min(A.a[0],A.b[0]),Math.min(A.a[1],A.b[1]),Math.max(A.a[0],A.b[0]),Math.max(A.a[1],A.b[1]));
      f.forEach(i=>msel.add(i.id));sel=null;if(msel.size&&!$('#panel').classList.contains('hidden'))tab='sel';refreshPanel();toast(`${msel.size}件を選択中。選んだものをドラッグするとまとめて移動します`);break;}
    case 'moveBed':if(A.moved){pushUndo(A.snap);changed();}break;
    case 'vertex':if(A.dirty){if(Math.abs(sArea(A.bed.pts))<50){restore(A.snap);toast('花壇が小さすぎます');}else pushUndo(A.snap);changed();}break;
    case 'rect':{const P=rectPts(A.a[0],A.a[1],A.b[0],A.b[1]);const bb=bbox(P);if(bb.w<10||bb.h<10){toast('10cm以上の大きさでドラッグしてください');break;}addSessionBed('rect',P,null);break;}
    case 'circle':{const r=Math.hypot(A.b[0]-A.a[0],A.b[1]-A.a[1]);if(r<5){toast('中心から外側へドラッグしてください');break;}addSessionBed('circle',circPts(A.a[0],A.a[1],r),{x:A.a[0],y:A.a[1],r});break;}
    case 'poly':{const q=A.p;if(polyPts.length>=3){const f=polyPts[0];if(Math.hypot((f[0]-q[0])*V.s,(f[1]-q[1])*V.s)<24){finishPoly();break;}}
      const l=polyPts[polyPts.length-1];if(!l||l[0]!==q[0]||l[1]!==q[1])polyPts.push(q);updateHint();break;}
    case 'seed':{const p=plantById(active.pid);const put=()=>{pushUndo();items().push({id:uid(),k:'s',p:p.id,x:A.p[0],y:A.p[1]});seasonWarn(p,'s');changed();};

function cancelAction(){if(action){if(action.snap&&action.dirty){restore(action.snap);computeConflicts();}action=null;render();}}
function addSessionBed(shape,pts,c){pushUndo();const b={id:uid(),name:nextBedName(),shape,pts};if(c)b.c=c;cur.beds.push(b);bs.created.push(b.id);
  sel={t:'bed',id:b.id};polyPts=[];setTool('select');changed();toast(`${b.name}（${sizeText(b)}）を追加しました。続けて描くと花壇が増えます`);}

/* ============ 自動配置 ============ */
function sBox(o){if(o.k==='s')return {minX:o.x-o.r,minY:o.y-o.r,maxX:o.x+o.r,maxY:o.y+o.r};if(o.k==='a')return {minX:o.x1,minY:o.y1,maxX:o.x2,maxY:o.y2};
  return {minX:Math.min(o.a[0],o.b[0])-o.r,minY:Math.min(o.a[1],o.b[1])-o.r,maxX:Math.max(o.a[0],o.b[0])+o.r,maxY:Math.max(o.a[1],o.b[1])+o.r};}
function autoFill(b){
  const p=plantById(active.pid);if(!p||!active.m){toast('植物タブで植物と「苗」または「播種」を選んでください');openPanel('plants');return;}
  if(active.m==='r'&&p.sow==='ばらまき'){toast('ばらまきは「播種」ツールで範囲をドラッグして指定してください');return;}
  const bb=bbox(b.pts);const base=obstacles().filter(o=>{const x=sBox(o);return x.maxX>bb.minX-120&&x.minX<bb.maxX+120&&x.maxY>bb.minY-120&&x.minY<bb.maxY+120;});
  const t0=performance.now();let added=[];
  if(active.m==='s'){
    const s=p.seedlingSp,r=s/2,hex=S.settings.pattern==='hex',dy=hex?s*Math.sqrt(3)/2:s;
    const est=(bb.w/s)*(bb.h/dy);const K=est>400?1:est>150?2:4;let best=[];
    for(let ix=0;ix<K;ix++)for(let iy=0;iy<K;iy++){const obs=base.slice(),pts=[];let row=0;
      for(let y=bb.minY+r+iy*dy/K;y<=bb.maxY-r+EPS;y+=dy,row++){const sh=hex&&row%2?s/2:0;
        for(let x=bb.minX+r+ix*s/K+sh-(hex&&row%2&&ix*s/K+sh>=s?s:0);x<=bb.maxX-r+EPS;x+=s){const q=[Math.round(x*10)/10,Math.round(y*10)/10];
          if(checkCircle(q[0],q[1],r,obs,b).ok){pts.push(q);obs.push({k:'s',x:q[0],y:q[1],r});}}}
      if(pts.length>best.length)best=pts;if(performance.now()-t0>2500)break;}
    added=best.map(q=>({id:uid(),k:'s',p:p.id,x:q[0],y:q[1]}));
  }else{
    const w=p.rowSp/2,step=p.rowSp;let dir=S.settings.rowDir;if(dir==='auto')dir=bb.w>=bb.h?'h':'v';
    const along=dir==='h'?[bb.minX,bb.maxX]:[bb.minY,bb.maxY],across=dir==='h'?[bb.minY,bb.maxY]:[bb.minX,bb.maxX];
    const P=(u,c)=>dir==='h'?[u,c]:[c,u];let best={len:0,rows:[]};
    for(let k=0;k<3;k++){const obs=base.slice(),rows=[];let tot=0;
      for(let c=across[0]+w+k*step/3;c<=across[1]-w+EPS;c+=step){let runS=null,last=null;const cc=Math.round(c*10)/10;
        const flush=()=>{if(runS!==null&&last-runS>=Math.max(10,p.seedSp)){let a=P(runS,cc),e=P(last,cc);let ok=checkRow(a,e,w,obs,b).ok,tries=0;
            while(!ok&&tries<6){runS+=0.5;last-=0.5;a=P(runS,cc);e=P(last,cc);ok=last>runS&&checkRow(a,e,w,obs,b).ok;tries++;}
            if(ok){rows.push([a,e]);obs.push({k:'r',a,b:e,r:w});tot+=last-runS;}}runS=null;last=null;};
        for(let u=Math.ceil(along[0]);u<=along[1];u+=1){const q=P(u,cc);if(checkCircle(q[0],q[1],w,obs,b).ok){if(runS===null)runS=u;last=u;}else flush();}
        flush();}
      if(tot>best.len)best={len:tot,rows};}
    added=best.rows.map(([a,e])=>({id:uid(),k:'r',p:p.id,x1:a[0],y1:a[1],x2:e[0],y2:e[1]}));
  }
  if(!added.length){toast('空いている場所がありません（間隔が足りません）');return;}
  pushUndo();plan().items.push(...added);seasonWarn(p,active.m);changed();
  toast(`${p.name}を${active.m==='s'?added.length+'株':added.length+'条'}自動配置しました`);
}

  area:'ドラッグでばらまく範囲（長方形）を指定。面積から種の量を計算します',fill:'花壇をタップ → 選択中の植物を空きに自動配置',multi:'ドラッグで囲んでまとめて選択、タップで追加・解除。選んだものをドラッグでまとめて移動',measure:'ドラッグで距離を測る',erase:'植物をタップで削除'},
  bed:{select:'花壇をタップで選択・ドラッグで移動。選んだ花壇の頂点●で変形、辺の中点○で頂点を追加',rect:'ドラッグで四角い花壇を追加',circle:'中心から外へドラッグで円形花壇を追加',
  poly:'タップで頂点を追加（押したまま位置調整）。最初の点をタップで完成',measure:'ドラッグで距離を測る（花壇どうしの通路幅など）'},
  view:{select:'確認モード：タップで詳細を表示、ドラッグで画面移動、2本指でズーム'}};
function updateHint(){const h=$('#hint');const hs=HINTS[wmode]||{};const key=wmode==='plant'&&tool==='row'&&activeIsBroadcast()?'area':tool;let x=`<span class="txt">${hs[key]||hs.select||''}</span>`;
  if(tool==='poly'&&polyPts.length)x+=`<button class="btn sm" id="pUndo">1点戻す</button><button class="btn sm" id="pCancel">中止</button><button class="btn sm pri" id="pDone" ${polyPts.length<3?'disabled':''}>完成</button>`;
  h.innerHTML=x;const q=id=>$('#'+id);if(q('pDone')){q('pDone').onclick=finishPoly;q('pUndo').onclick=()=>{polyPts.pop();updateHint();render();};q('pCancel').onclick=()=>{polyPts=[];updateHint();render();};}
  updateChip();}
function updateChip(){const c=$('#chip');
  if(wmode==='bed'){const b=sel&&sel.t==='bed'&&bedById(sel.id);c.style.display='';c.innerHTML=b?`<b>${esc(b.name)}</b> ${sizeText(b)}・${fmt(bedArea(b)/10000)}㎡`:`<span class="muted">花壇 ${S.beds.length}個　四角・円・多角形で追加できます</span>`;return;}
  if(wmode==='view'){c.style.display='none';return;}
  c.style.display='';const p=plantById(active.pid);
  if(!p||!active.m){c.innerHTML=`<span class="muted">植物タブで植物を選ぶと配置できます</span>`;return;}
  c.innerHTML=active.m==='s'?`<span class="dot" style="background:${p.color}"></span><b>${esc(p.name)}</b> 苗・株間${p.seedlingSp}cm`:p.sow==='ばらまき'?`<span class="ln" style="background:${p.color};height:12px"></span><b>${esc(p.name)}</b> ばらまき・${p.perPoint}粒/㎡`:`<span class="ln" style="background:${p.color}"></span><b>${esc(p.name)}</b> ${p.sow}・条間${p.rowSp}／株間${p.seedSp}cm`;}

const tb=(t,ic,l)=>`<button class="tbtn" data-tool="${t}"><span class="ic">${ic}</span>${l}</button>`;
const cmd=(c,ic,l,cls='')=>`<button class="tbtn ${cls}" data-cmd="${c}"><span class="ic">${ic}</span>${l}</button>`;
const SEP='<div class="sep"></div>';

    tb('measure','📏','計測')+tb('erase','⌫','削除')+cmd('undo','↶','戻す')+cmd('redo','↷','やり直す')+cmd('fit','⤢','全体')+SEP+cmd('bedEdit','▭','花壇編集')+cmd('addBed','＋','花壇追加')+cmd('north','🧭','方位')+SEP+sels+cmd('panel','☰','パネル');
  if(wmode==='bed')h=cmd('bedBack','←','戻る')+`<span class="ttl">花壇の配置・形</span>`+SEP+tb('select','✋','選択・移動')+tb('rect','▭','四角')+tb('circle','◯','円')+tb('poly','⬠','多角形')+SEP+
    tb('measure','📏','計測')+cmd('undo','↶','戻す')+cmd('redo','↷','やり直す')+cmd('fit','⤢','全体')+cmd('north','🧭','方位')+cmd('panel','☰','パネル')+SEP+cmd('bedOk','→','決定','go');
  if(wmode==='view')h=cmd('toRecords','←','記録へ')+`<span class="ttl">${esc(cur.name)}（確認）</span>`+SEP+cmd('fit','⤢','全体')+sels+cmd('panel','☰','パネル')+SEP+cmd('viewEdit','✎','つづきから','go')+cmd('viewCopy','⧉','コピーして編集');

$('#tb').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;

  if(c==='panel'){$('#panel').classList.toggle('hidden');refreshPanel();resize();}

  if(c==='rename')promptText('プロジェクト名','名前',cur.name,v=>{cur.name=v;changed();renderToolbar();});

function fitView(){const pts=S.beds.flatMap(b=>b.pts);if(!pts.length){V.s=2.5;V.ox=60;V.oy=80;render();return;}
  const bb=bbox(pts),pad=70;V.s=clamp(Math.min((CW-pad*2)/(bb.w||100),(CH-pad*2-40)/(bb.h||100)),0.1,40);V.ox=(CW-bb.w*V.s)/2-bb.minX*V.s;V.oy=(CH-bb.h*V.s)/2-bb.minY*V.s+10;render();}
const DIRS=[[0,'上が北'],[45,'右上が北'],[90,'右が北'],[135,'右下が北'],[180,'下が北'],[225,'左下が北'],[270,'左が北'],[315,'左上が北']];

function projectThumb(p,W=360,H=240){const keep=cur,ks=sel,kb=bs,km=wmode;cur=p;sel=null;bs=null;wmode='plant';noLabels=true;let url='';
  try{const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');const pts=p.beds.flatMap(b=>b.pts);let v={s:1,ox:W/2,oy:H/2};
    if(pts.length){const bb=bbox(pts);const s=Math.min((W-30)/(bb.w||1),(H-30)/(bb.h||1));v={s,ox:(W-bb.w*s)/2-bb.minX*s,oy:(H-bb.h*s)/2-bb.minY*s};}
    drawScene(x,W,H,v,{export:true,thumb:true});url=c.toDataURL('image/png');}catch(e){}
  cur=keep;sel=ks;bs=kb;wmode=km;noLabels=false;return url;}
function projSummary(p){const n=p.plans.reduce((a,pl)=>a+pl.items.length,0);return `花壇${p.beds.length}・配置${n}件`;}

/* ---- 花壇の形を選ぶ（花壇一覧） ---- */
function shapeSvg(beds){const pts=beds.flatMap(b=>b.pts);const bb=bbox(pts),W=150,H=100,s=Math.min((W-16)/(bb.w||1),(H-16)/(bb.h||1));const ox=(W-bb.w*s)/2-bb.minX*s,oy=(H-bb.h*s)/2-bb.minY*s;
  return `<svg class="th" viewBox="0 0 ${W} ${H}" aria-hidden="true">${beds.map(b=>`<path d="${b.pts.map((p,i)=>(i?'L':'M')+(p[0]*s+ox).toFixed(1)+' '+(p[1]*s+oy).toFixed(1)).join('')}Z" fill="var(--soil)" stroke="var(--soilEdge)" stroke-width="1.5"/>`).join('')}</svg>`;}
function typeSize(t){if(t.beds.length===1){const b=t.beds[0];return `${sizeText(b)}・${fmt(bedArea(b)/10000)}㎡`;}const bb=bbox(t.beds.flatMap(b=>b.pts));return `${t.beds.length}花壇・全体${fmt(bb.w)}×${fmt(bb.h)}cm・計${fmt(t.beds.reduce((a,b)=>a+bedArea(b),0)/10000)}㎡`;}
function showBedPick(ctx){const isNew=ctx.from==='new';
  const body=`${isNew?'<div class="steps">① 名前 → <b>② 花壇の形</b> → ③ 植え付け</div>':''}<p class="muted">花壇一覧から選ぶか、「新規の花壇」で形を作ります。複数の花壇がまとまったセットも選べます。${isNew?'':'追加した花壇は花壇編集の画面で位置を調整できます。'}</p>
  <div class="cards"><button class="card bt new" data-bt="new"><span class="pl2">＋</span>新規の花壇<span class="muted" style="font-weight:400;font-size:12px">形と寸法を自分で設定（複数可）</span></button>
  ${DB.bedTypes.map(t=>`<div class="card bt"><button class="btw" data-bt="${t.id}">${shapeSvg(t.beds)}<div class="cb"><b>${esc(t.name)}</b>${t.beds.length>1?` <span class="tag">${t.beds.length}花壇</span>`:''}<div class="muted">${typeSize(t)}</div></div></button><button class="x" data-btdel="${t.id}" aria-label="${esc(t.name)}を一覧から削除">✕</button></div>`).join('')}</div>`;
  showPage(isNew?'花壇の形を選ぶ':'花壇を追加',body,{back:isNew?showNewProject:()=>openWork('plant',{fit:false}),refresh:()=>showBedPick(ctx),actions:`<button class="btn sm" id="btJson">座標データから登録</button>`});
  $('#btJson').onclick=()=>jsonBedModal(ctx);
  $('#pgBody').onclick=e=>{const d=e.target.closest('[data-btdel]');if(d){const t=DB.bedTypes.find(x=>x.id===d.dataset.btdel);askConfirm(`「${t.name}」を花壇一覧から削除しますか？（作成済みの花壇には影響しません）`,()=>{DB.bedTypes=DB.bedTypes.filter(x=>x!==t);save();showBedPick(ctx);},'削除する');return;}
    const b=e.target.closest('[data-bt]');if(!b)return;
    if(b.dataset.bt==='new'){openWork('bed',{from:ctx.from});return;}
    useBedType(DB.bedTypes.find(x=>x.id===b.dataset.bt),ctx);};}
function placeOffset(p){const pts=p.beds.flatMap(b=>b.pts);if(!pts.length)return {x:0,y:0};const bb=bbox(pts);return {x:bb.maxX+100,y:bb.minY};}
function ensureProject(){if(pending){if(!DB.projects.includes(pending))DB.projects.push(pending);cur=pending;pending=null;}return cur;}
function useBedType(t,ctx){const p=cur;const snap0=snapshot();const off=placeOffset(p);const bb=bbox(t.beds.flatMap(b=>b.pts));
  const used=new Set(p.beds.map(b=>b.name));const ids=[];
  moveBeds(t.beds,off.x-bb.minX,off.y-bb.minY).forEach(b=>{b.id=uid();if(!b.name||used.has(b.name))b.name=nextBedName(p);used.add(b.name);p.beds.push(b);ids.push(b.id);});
  ensureProject();cur.updated=Date.now();saveNow();
  if(ctx&&ctx.from==='add'){openWork('bed',{from:'addpick',created:ids,selId:ids[0],snap:snap0});toast(`「${t.name}」を追加しました。位置を調整して「決定」を押してください`);}
  else{openWork('plant');toast(`「${t.name}」を配置しました`);}}
/* 座標データ（JSON）から花壇を登録 */
function parseBedJson(o){const k=/mm/i.test(o.unit||'')?0.1:/^m$/i.test(o.unit||'')?100:1;const out=[];const lab=o.bed_labels||{};
  const mk=(name,pts)=>out.push({name,shape:'poly',pts:pts.map(p=>[+(p[0]*k).toFixed(2),+(p[1]*k).toFixed(2)])});
  if(o.circular_bed&&o.circular_bed.center_mm){const c=o.circular_bed,r=(c.interior_radius_mm||c.interior_diameter_mm/2)*0.1,x=c.center_mm[0]*0.1,y=c.center_mm[1]*0.1;out.push({name:lab.circle?String(lab.circle).replace(/\(.*\)/,''):'円形',shape:'circle',c:{x,y,r},pts:circPts(x,y,r)});}
  const polys=o.rectangular_beds_interior_polygons||o.polygons||null;if(polys)Object.entries(polys).forEach(([n,pts])=>mk(lab[n]||n,pts));
  if(Array.isArray(o.beds))o.beds.forEach((b,i)=>{if(b.circle||b.center){const c=b.circle||[...b.center,b.radius];out.push({name:b.name||`花壇${i+1}`,shape:'circle',c:{x:c[0]*k,y:c[1]*k,r:c[2]*k},pts:circPts(c[0]*k,c[1]*k,c[2]*k)});}else if(b.pts||b.points)mk(b.name||`花壇${i+1}`,b.pts||b.points);});
  return out.filter(b=>b.pts.length>=3);}
function jsonBedModal(ctx){openModal('座標データから花壇を登録',`<p class="muted">花壇の頂点座標をまとめたJSONを読み込み、花壇一覧に登録します。単位（unit）が mm の場合は自動でcmに換算します。</p>
  <div class="fld"><label>ファイルから</label><input class="inp" type="file" id="bjF" accept=".json,application/json,text/plain"></div><div class="fld"><label>または貼り付け</label><textarea class="inp" id="bjT"></textarea></div>
  <div class="fld"><label>登録名</label><input class="inp" id="bjN" value="読み込んだ花壇"></div><label class="sw"><input type="checkbox" id="bjE" checked>1つずつの花壇としても登録する</label>`,
  `<button class="btn" data-close>やめる</button><button class="btn pri" id="bjGo">登録する</button>`);
  $('#bjF').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#bjT').value=r.result;};r.readAsText(f);};
  $('#bjGo').onclick=()=>{let beds=[];try{beds=parseBedJson(JSON.parse($('#bjT').value));}catch(e){}if(!beds.length)return toast('花壇の座標が見つかりませんでした');
    const name=$('#bjN').value.trim()||'読み込んだ花壇';DB.bedTypes.unshift({id:uid(),name,beds:normBeds(beds)});
    if($('#bjE').checked)beds.forEach(b=>DB.bedTypes.push({id:uid(),name:`${name} ${b.name}`,beds:normBeds([b])}));
    save();closeModal();showBedPick(ctx);toast(`${beds.length}個の花壇を登録しました`);};}

function openWork(mode,opts={}){wmode=mode;msel=new Set();showScreen('work');undoS=[];redoS=[];sel=null;measure=null;polyPts=[];action=null;
  if(mode==='bed'){bs={from:opts.from||'edit',snap:opts.snap||snapshot(),created:opts.created||[]};if(opts.selId)sel={t:'bed',id:opts.selId};tool=S.beds.length?'select':'rect';tab='bed';}
  else{bs=null;tool='select';tab=mode==='view'?'sum':'plants';}
  if(innerWidth>760)$('#panel').classList.remove('hidden');
  renderToolbar();computeConflicts();refreshPanel();updateHint();
  requestAnimationFrame(()=>{resize();if(opts.fit!==false)fitView();});}
function bedCancel(){const goBack=()=>{restore(bs.snap);const f=bs.from;bs=null;
    if(f==='new')showBedPick({from:'new'});else if(f==='add'||f==='addpick')showBedPick({from:'add'});else openWork('plant',{fit:false});};
  if(undoS.length||bs.from==='addpick')askConfirm(bs.from==='addpick'?'追加した花壇を取り消して戻りますか？':'花壇の変更を破棄して戻りますか？',goBack,'破棄して戻る');else goBack();}
function defaultTypeName(b){const bb=bbox(b.pts);return b.shape==='circle'?`円形 直径${fmt(b.c.r*2)}`:b.shape==='rect'?`長方形 ${fmt(bb.w)}×${fmt(bb.h)}`:`多角形 ${fmt(bb.w)}×${fmt(bb.h)}`;}
function bedDecide(){if(!S.beds.length)return toast('まず四角・円・多角形で花壇を描いてください');
  const created=new Set(bs.created.filter(id=>bedById(id)));const def=bs.from==='addpick'?new Set():created;
  openModal('花壇の決定',`<div class="row" style="align-items:flex-start"><div style="width:150px">${shapeSvg(S.beds)}</div><div><b>花壇 ${S.beds.length}個</b><div class="muted">計${fmt(S.beds.reduce((a,b)=>a+bedArea(b),0)/10000)}㎡</div></div></div>
    <h3>花壇一覧に登録しますか？</h3><p class="muted">登録すると、次回から選ぶだけで使えます。登録する花壇にチェックしてください。</p>
    <div id="bdList">${S.beds.map(b=>`<label class="sw"><input type="checkbox" value="${b.id}" ${def.has(b.id)?'checked':''}> ${esc(b.name)}（${sizeText(b)}）${created.has(b.id)?' <span class="tag">新規</span>':''}</label>`).join('')}</div>
    <div class="seg" id="bdMode"><button data-m="group" class="on">まとめて1つに登録</button><button data-m="each">1つずつ登録</button></div>
    <div class="fld" id="bdNameF"><label>登録名（まとめて登録する場合）</label><input class="inp" id="btName" value="${esc(cur.name)}の花壇"></div>`,
    `<button class="btn" data-close>戻って編集</button><button class="btn pri" id="bdGo">決定して植え付けへ</button>`);
  let mode='group';$$('#bdMode button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;$$('#bdMode button').forEach(x=>x.classList.toggle('on',x===b));$('#bdNameF').style.display=mode==='group'?'':'none';});
  const upd=()=>{const ch=$$('#bdList input:checked');if(ch.length===1&&mode==='group'){const b=bedById(ch[0].value);$('#btName').value=defaultTypeName(b);}};$$('#bdList input').forEach(i=>i.onchange=upd);upd();
  $('#bdGo').onclick=()=>{const ids=$$('#bdList input:checked').map(i=>i.value);const beds=ids.map(bedById).filter(Boolean).map(b=>{const n=JSON.parse(JSON.stringify(b));delete n.id;return n;});
    let msg='花壇を決定しました';
    if(beds.length){if(mode==='group'||beds.length===1){DB.bedTypes.push({id:uid(),name:($('#btName').value||'').trim()||defaultTypeName(beds[0]),beds:normBeds(beds)});}
      else beds.forEach(b=>DB.bedTypes.push({id:uid(),name:`${b.name} ${defaultTypeName(b)}`,beds:normBeds([b])}));msg=`花壇一覧に${mode==='group'||beds.length===1?1:beds.length}件登録しました`;}
    closeModal();ensureProject();cur.updated=Date.now();saveNow();openWork('plant',{fit:true});toast(msg+'。植物を配置していきましょう');};}

    <h3>操作</h3><div class="grid2"><button class="btn" data-act="fillBed">選択中の植物で自動配置</button><button class="btn" data-act="editShape">位置・形を編集</button><button class="btn" data-act="clearBed">植物をすべて外す</button></div>`;}

function dupItem(){const it=itemById(sel.id);const p=plantById(it.p);let c=null;
  if(it.k==='s'){const s=p.seedlingSp;for(const [dx,dy] of [[s,0],[0,s],[-s,0],[0,-s],[s/2,s*0.866],[-s/2,s*0.866]]){const t={...it,id:uid(),x:it.x+dx,y:it.y+dy};if(checkItem(t,obstacles()).ok){c=t;break;}}}
  else if(it.k==='a'){const w=Math.abs(it.x2-it.x1),h=Math.abs(it.y2-it.y1);for(const [dx,dy] of [[w,0],[0,h],[-w,0],[0,-h]]){const t={...it,id:uid(),x1:it.x1+dx,x2:it.x2+dx,y1:it.y1+dy,y2:it.y2+dy};if(checkItem(t,obstacles()).ok){c=t;break;}}}
  else{const L=rowLen(it)||1,nx=-(it.y2-it.y1)/L*p.rowSp,ny=(it.x2-it.x1)/L*p.rowSp;for(const k of [1,-1]){const t={...it,id:uid(),x1:it.x1+nx*k,y1:it.y1+ny*k,x2:it.x2+nx*k,y2:it.y2+ny*k};if(checkItem(t,obstacles()).ok){c=t;break;}}}
  if(!c)return toast('隣に置けるスペースがありません');pushUndo();items().push(c);sel={t:'item',id:c.id};changed();}

function companionHtml(){const its=items().map(i=>({i,p:plantById(i.p),s:shapeOf(i)})).filter(x=>x.p&&x.s);const bad=new Set(),good=new Set();
  const has=(n,k)=>n.includes(k);
  for(let x=0;x<its.length;x++)for(let y=x+1;y<its.length;y++){const A=its[x],B=its[y];if(A.p===B.p)continue;
    const pr=L=>L.find(([u,v])=>(has(A.p.name,u)&&has(B.p.name,v))||(has(A.p.name,v)&&has(B.p.name,u)));
    const bp=pr(BAD_PAIRS),gp=pr(GOOD_PAIRS);if(!bp&&!gp)continue;if(coreDist(A.s,B.s)-A.s.r-B.s.r>40)continue;
    const key=[A.p.name,B.p.name].sort().join('と');if(bp)bad.add(key);else good.add(key);}
  if(!bad.size&&!good.size)return '';

const CSV_HEAD='名前,分類,播種月,植付月,収穫月,まき方,条間cm,株間cm(播種),粒数,苗の株間cm,支柱の立て方,支柱長cm,ネット幅cm,防寒など,色';
const mCsv=a=>fmtMonths(a).replace('月','').replace(/・/g,'/');
function plantToCsv(p){const P=p.prot;const pr=[P.fleece.on&&'不織布',P.tunnel.on&&'トンネル',P.mulch.on&&'マルチ',P.straw.on&&'稲藁',P.husk.on&&'籾殻'].filter(Boolean).join(' ');
  return [p.name,p.cat,mCsv(p.seedM),mCsv(p.plantM),mCsv(p.harvM),p.sow,p.rowSp,p.seedSp,p.perPoint,p.seedlingSp,p.mat.pole.on?p.mat.pole.style:'なし',p.mat.pole.len,p.mat.net.on?p.mat.net.w:'なし',pr||'なし',p.color].join(',');}
function csvModal(){openModal('一覧表で一括登録',`<p class="muted">1行に1品目。表計算アプリからのコピー（タブ区切り）もそのまま貼り付けできます。同じ名前は上書きします。月は「3-5/9」、防寒などは「不織布 マルチ」のようにスペースで区切ります。ばらまきの粒数は1㎡あたりです。</p>
  <textarea class="inp" id="csvT" placeholder="${CSV_HEAD}">${CSV_HEAD}\nスナップエンドウ,野菜,10-11,,4-5,点まき,60,30,3,0,合掌型,180,180,不織布,#6fae5a\nベビーリーフ,野菜,3-5/9-10,,4-6/10-12,ばらまき,0,0,1500,0,なし,0,なし,不織布,#8bc34a</textarea>`,
  `<button class="btn" id="csvOut">登録済みを表示</button><button class="btn" data-close>やめる</button><button class="btn pri" id="csvIn">読み込む</button>`);
  $('#csvOut').onclick=()=>{$('#csvT').value=[CSV_HEAD,...DB.plants.map(plantToCsv)].join('\n');};
  $('#csvIn').onclick=()=>{const lines=$('#csvT').value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);let add=0,upd=0,err=0;pushUndo();
    lines.forEach(l=>{const f=l.split(/\t|,/).map(x=>x.trim().replace(/^"|"$/g,''));if(f[0]==='名前'||!f[0])return;
      const np=mkPlant([f[0],CATS.includes(f[1])?f[1]:'野菜',f[2],f[3],f[4],f[6],f[7],SOWS.includes(f[5])?f[5]:'点まき',f[8],f[9],'なし',0,'なし',/^#[0-9a-f]{6}$/i.test(f[14]||'')?f[14]:null]);
      if(POLE_STYLES.includes(f[10])){np.mat.pole.on=true;np.mat.pole.style=f[10];np.mat.pole.len=+f[11]||150;}else np.mat.pole.on=false;
      if(+f[12]>0){np.mat.net.on=true;np.mat.net.w=+f[12];}else np.mat.net.on=false;
      const pr=(f[13]||'').split(/[\s・\/]+/);np.prot.fleece.on=pr.includes('不織布');np.prot.tunnel.on=pr.includes('トンネル');np.prot.mulch.on=pr.includes('マルチ');np.prot.straw.on=pr.includes('稲藁');np.prot.husk.on=pr.includes('籾殻');
      if(!hasSeed(np)&&!hasSeedling(np))err++;
      const ex=DB.plants.find(p=>p.name===np.name);if(ex){const id=ex.id,col=/^#/.test(f[14]||'')?np.color:ex.color;Object.assign(ex,np,{id,color:col});upd++;}else{DB.plants.push(np);add++;}});
    if(!add&&!upd){undoS.pop();return toast('読み込める行がありません');}
    closeModal();changed();toast(`追加${add}件・更新${upd}件${err?`（時期か間隔が未入力：${err}件）`:''}`);};}
function tableModal(){const body=()=>`<div class="scroll"><table><tr><th></th><th>名前</th><th>播種</th><th>苗</th><th class="n">条間/株間</th><th class="n">苗株間</th><th>資材</th><th></th></tr>

  <td class="n">${hasSeed(p)?(p.sow==='ばらまき'?`${p.perPoint}粒/㎡`:`${p.rowSp}/${p.seedSp}`)+`<br><span class="muted">${p.sow}</span>`:''}</td><td class="n">${hasSeedling(p)?p.seedlingSp:''}</td><td>${esc(matSummary(p))}</td><td><button class="btn sm" data-ed="${p.id}">編集</button></td></tr>`).join('')}</table></div>`;
  openModal(`登録一覧（${DB.plants.length}件）`,body(),`<button class="btn dan" id="tDel">チェックしたものを削除</button><button class="btn" data-close>閉じる</button>`);

    askConfirm(`${ids.length}件の植物を削除しますか？配置済みのものも消えます。`,()=>{pushUndo();DB.plants=DB.plants.filter(p=>!ids.includes(p.id));allPlans().forEach(pl=>pl.items=pl.items.filter(i=>!ids.includes(i.p)));if(ids.includes(active.pid))active={pid:null,m:null};changed();});};}

function presetsModal(){const have=new Set(S.plants.map(p=>p.name));const list=PRESETS.filter(a=>!have.has(a[0]));
  if(!list.length){openModal('候補からまとめて追加','<p>候補はすべて登録済みです。</p>');return;}
  openModal('候補からまとめて追加',`<p class="muted">追加したいものにチェック。時期や間隔は一般的な目安（中間地）です。登録後に編集できます。</p>
  <label class="sw"><input type="checkbox" id="psAll">すべて選ぶ</label>
  ${CATS.map(c=>{const r=list.filter(a=>a[1]===c);return r.length?`<h3>${c}</h3>`+r.map(a=>{const p=mkPlant(a);return `<label class="pl" style="cursor:pointer"><input type="checkbox" class="ps" value="${esc(a[0])}" style="width:24px;height:24px;accent-color:var(--leaf)"><span class="dot" style="background:${a[13]}"></span><span class="nm"><b>${esc(a[0])}</b><span>${hasSeed(p)?`播種${fmtMonths(p.seedM)} 条間${p.rowSp}/株間${p.seedSp}`:''} ${hasSeedling(p)?`苗${fmtMonths(p.plantM)} 株間${p.seedlingSp}`:''}</span></span></label>`;}).join(''):'';}).join('')}`,
  `<button class="btn" data-close>やめる</button><button class="btn pri" id="psAdd">チェックしたものを追加</button>`);
  $('#psAll').onchange=e=>$$('#mb .ps').forEach(x=>x.checked=e.target.checked);
  $('#psAdd').onclick=()=>{const names=$$('#mb .ps:checked').map(x=>x.value);if(!names.length)return toast('1つ以上選んでください');pushUndo();
    PRESETS.filter(a=>names.includes(a[0])).forEach(a=>S.plants.push(mkPlant(a)));closeModal();changed();toast(`${names.length}件を追加しました`);};}
/* ============ 書き出し ============ */
function exportData(){const j=JSON.stringify(DB);openModal('データを書き出す',`<p class="muted">すべての計画・作物一覧・花壇一覧を含みます。「ファイルに保存」するか、文字列をコピーしてメモなどに保存してください。</p><textarea class="inp" id="exT" readonly>${esc(j)}</textarea>`,
  `<button class="btn" data-close>閉じる</button><button class="btn" id="exF">ファイルに保存</button><button class="btn pri" id="exC">コピーする</button>`);
  $('#exF').onclick=()=>{const d=new Date(),nm=`potager-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;
    if(NATIVE)return nativePost({type:'shareText',name:nm,data:j});
    try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([j],{type:'application/json'}));a.download=nm;document.body.appendChild(a);a.click();a.remove();}catch(e){toast('この環境ではコピーを使ってください');}};
  $('#exC').onclick=async()=>{const t=$('#exT');t.removeAttribute('readonly');t.select();t.setSelectionRange(0,t.value.length);let ok=false;try{await navigator.clipboard.writeText(t.value);ok=true;}catch(_){try{ok=document.execCommand('copy');}catch(__){}}t.setAttribute('readonly','');toast(ok?'コピーしました':'文字列を長押しして全選択→コピーしてください');};}
function importData(){openModal('データを読み込む',`<p class="muted">書き出したファイルか文字列を読み込みます。<b>現在のデータはすべて置き換わります。</b>以前の版で書き出したデータも読み込めます。</p>
  <div class="fld"><label>ファイルから読み込む</label><input class="inp" type="file" id="imF" accept=".json,application/json,text/plain"></div><div class="fld"><label>または文字列を貼り付け</label><textarea class="inp" id="imT"></textarea></div>`,
  `<button class="btn" data-close>やめる</button><button class="btn pri" id="imGo">読み込む</button>`);
  $('#imF').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#imT').value=r.result;toast('ファイルを読み込みました。「読み込む」で反映します');};r.readAsText(f);};
  $('#imGo').onclick=()=>{let d=null;try{d=parseDB(JSON.parse($('#imT').value));}catch(e){}if(!d)return toast('データの形式が正しくありません');
    DB=d;saveNow();closeModal();applyTheme();showHome();toast(`読み込みました（計画${DB.projects.length}件・作物${DB.plants.length}品目）`);};}
function exportImage(){const pts=S.beds.flatMap(b=>b.pts);if(!pts.length)return toast('花壇がありません');const bb=bbox(pts);const s=clamp(Math.min(1600/bb.w,1600/bb.h),0.5,8);
  const t=tally(items());const legendH=40+Math.ceil(t.length/3)*22;const W=Math.round(bb.w*s+160),H=Math.round(bb.h*s+170+legendH);
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');const v={s,ox:80-bb.minX*s,oy:90-bb.minY*s};const keepSel=sel;sel=null;
  drawScene(x,W,H-legendH,v,{export:true});sel=keepSel;
  x.fillStyle=colors.panel;x.fillRect(0,H-legendH,W,legendH);x.fillStyle=colors.ink;x.font='700 18px -apple-system,sans-serif';x.textAlign='left';x.textBaseline='top';x.fillText(`${cur.name}　${plan().name}`,16,14);
  x.font='13px -apple-system,sans-serif';t.forEach((q,i)=>{const cx=16+(i%3)*((W-32)/3),cy=H-legendH+14+Math.floor(i/3)*22;x.fillStyle=q.p.color;x.beginPath();x.arc(cx+6,cy+8,6,0,Math.PI*2);x.fill();x.fillStyle=colors.ink;
    x.fillText(`${q.p.name} ${q.sd?q.sd+'株':''}${q.rows?` ${q.rows}条(${q.rowPlants}株)`:''}${q.areas?` ばらまき${fmt(q.m2)}㎡`:''}`,cx+18,cy+1);});
  let url;try{url=c.toDataURL('image/png');}catch(e){return toast('画像を作れませんでした');}
  if(NATIVE){openModal('図面の画像',`<img src="${url}" alt="作図の画像" style="width:100%;border:1px solid var(--line);border-radius:10px;-webkit-touch-callout:none">`,`<button class="btn" data-close>閉じる</button><button class="btn pri" id="imgS">共有・ファイルに保存</button>`);
    $('#imgS').onclick=()=>nativePost({type:'shareImage',name:`${cur.name}-${plan().name}.png`.replace(/[\\/:*?"<>|]/g,'_'),data:url});render();return;}
  openModal('図面の画像',`<p class="muted">画像を長押しして「"写真"に保存」や共有ができます。</p><img src="${url}" alt="作図の画像" style="width:100%;border:1px solid var(--line);border-radius:10px;-webkit-touch-callout:default;user-select:auto">`);render();}

/* ============ 起動 ============ */
function applyTheme(){const t=S.settings.theme;if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t);readColors();if(screen==='work')render();}
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{readColors();if(screen==='work')render();});}catch(e){}
new ResizeObserver(()=>{if(screen==='work')resize();}).observe(cwrap);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveNow();});
applyTheme();saveNow();showHome();

/* ============ オフライン（PWA） ============ */
if('serviceWorker' in navigator&&location.protocol==='https:'){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});
  let hadCtrl=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadCtrl)toast('新しい版を取り込みました。アプリを開き直すと反映されます');hadCtrl=true;});
}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}

</script>
